schemaVersion: 1
repo: shared-go
defaults:
  critical:
    max_ns_regression_percent: 10
    max_bytes_regression_percent: 10
    allow_alloc_increase: false
  hotpath:
    max_ns_regression_percent: 15
    max_bytes_regression_percent: 15
    allow_alloc_increase: false
  build_path:
    max_ns_regression_percent: 20
    max_bytes_regression_percent: 20
    allow_alloc_increase: warn
  non_critical:
    max_ns_regression_percent: 25
    max_bytes_regression_percent: 25
    allow_alloc_increase: warn
benchmarks:
  BenchmarkNewProfiledClient: { package: ./pkg/httputil, class: build_path, gate: pr, harness_files: [pkg/httputil/client_bench_test.go] }
  BenchmarkIsSensitiveKey: { package: ./pkg/logging, class: hotpath, gate: pr, harness_files: [pkg/logging/sanitize_bench_test.go] }
  BenchmarkSanitizeHandlerClean: { package: ./pkg/logging, class: hotpath, gate: pr, harness_files: [pkg/logging/sanitize_bench_test.go] }
  BenchmarkSanitizeHandlerSensitive: { package: ./pkg/logging, class: hotpath, gate: pr, harness_files: [pkg/logging/sanitize_bench_test.go] }
  BenchmarkSanitizeHandlerGroupNoSecret: { package: ./pkg/logging, class: hotpath, gate: nightly, harness_files: [pkg/logging/sanitize_bench_test.go] }
  BenchmarkSanitizeHandlerGroupWithSecret: { package: ./pkg/logging, class: hotpath, gate: nightly, harness_files: [pkg/logging/sanitize_bench_test.go] }
  BenchmarkQueuedPoolSubmitSingle: { package: ./pkg/workerpool, class: hotpath, gate: pr, harness_files: [pkg/workerpool/queued_pool_bench_test.go] }
  BenchmarkQueuedPoolSubmitParallel: { package: ./pkg/workerpool, class: hotpath, gate: pr, harness_files: [pkg/workerpool/queued_pool_bench_test.go] }
  BenchmarkQueuedPoolTrySubmitFull: { package: ./pkg/workerpool, class: hotpath, gate: nightly, harness_files: [pkg/workerpool/queued_pool_bench_test.go] }
  BenchmarkBackoffHalfJitter: { package: ./pkg/backoff, class: hotpath, gate: pr, harness_files: [pkg/backoff/backoff_bench_test.go] }
  BenchmarkNormalizeViewsKorean: { package: ./pkg/promptguard, class: hotpath, gate: pr, harness_files: [pkg/promptguard/text_fastpath_test.go] }
  BenchmarkNormalizeViewsEnglish: { package: ./pkg/promptguard, class: hotpath, gate: pr, harness_files: [pkg/promptguard/text_fastpath_test.go] }
  BenchmarkNormalizeViewsMixed: { package: ./pkg/promptguard, class: hotpath, gate: pr, harness_files: [pkg/promptguard/text_fastpath_test.go] }
  BenchmarkHistogramObserveConcurrent: { package: ./pkg/obsmetrics, class: hotpath, gate: pr, harness_files: [pkg/obsmetrics/histogram_test.go] }
  BenchmarkCounterVecConcurrentCardinality: { package: ./pkg/obsmetrics, class: non_critical, gate: nightly, harness_files: [pkg/obsmetrics/vec_test.go] }
  BenchmarkHistogramVecConcurrentCardinality: { package: ./pkg/obsmetrics, class: non_critical, gate: nightly, harness_files: [pkg/obsmetrics/vec_test.go] }
settings:
  mode: fail
  benchstat_alpha: 0.05
  min_count: 6
  noise_floor_ns: 50
