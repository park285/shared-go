---
id: no-comments-bash
language: Bash
severity: error
message: 주석은 금지됩니다. 의도는 함수·변수 이름과 usage 출력, 실패 메시지로 옮기세요.
note: |
  허용되는 것은 기계 지시문뿐입니다: shebang(#!), # shellcheck ...
  확장자 없는 hook·helper는 sgconfig.yml languageGlobs에 파일 이름을 등록해야 검사됩니다.
rule:
  kind: comment
  not:
    any:
      - regex: '^# ?shellcheck '
      - all:
          - regex: '^#!'
          - nthChild: 1
          - inside:
              kind: program
ignores:
  - 'docs/**'
  - '**/testdata/**'
  - '**/fixtures/**'
---
id: no-comments-python
language: Python
severity: error
message: 주석은 금지됩니다. 의도는 이름·타입 힌트·테스트로 옮기세요.
note: |
  허용되는 것은 기계 지시문뿐입니다: shebang(#!), # -*- coding, # noqa, # type: ignore, # pyright:, # pragma
rule:
  kind: comment
  not:
    any:
      - regex: '^(# -\*- coding|# ?noqa|# ?type: ?ignore|# ?pyright:|# ?pragma)'
      - all:
          - regex: '^#!'
          - nthChild: 1
          - inside:
              kind: module
ignores:
  - 'docs/**'
  - '**/testdata/**'
  - '**/fixtures/**'
---
id: no-docstrings-python
language: Python
severity: error
message: docstring은 금지됩니다. 설명이 필요한 CLI 도움말은 argparse description 같은 실제 문자열 인자로 옮기세요.
note: |
  실행되지 않는 문자열 문장은 주석과 같습니다. 본문이 docstring뿐이면 지운 자리에 pass를 둡니다.
rule:
  kind: expression_statement
  all:
    - has:
        kind: string
    - not:
        has:
          not:
            kind: string
    - not:
        has:
          stopBy: end
          kind: interpolation
ignores:
  - 'docs/**'
  - '**/testdata/**'
  - '**/fixtures/**'
