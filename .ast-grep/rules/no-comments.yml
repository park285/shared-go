id: no-comments-go
language: Go
severity: error
message: 주석은 금지됩니다. 의도는 이름·타입·테스트로, 불변식은 검사 코드·lint 규칙·테스트로 옮기세요.
note: |
  주석은 강제력이 없고 코드보다 먼저 낡으며, 임시방편을 정당화하는 자리가 됩니다.
  허용되는 것은 기계 지시문뿐입니다: //go:, //nolint:<linter> // 사유, // #nosec, //line, //export, // Code generated ... DO NOT EDIT.
  자동 수정은 없습니다. 주석이 토큰 경계나 Example 출력·cgo preamble 역할을 할 수 있으므로 진단 위치에서 직접 지우고 gofmt를 실행합니다.
rule:
  kind: comment
  not:
    regex: '^(//go:|//nolint:|//line |//export |// ?#nosec|// Code generated .* DO NOT EDIT\.$)'
ignores:
  - 'docs/**'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/*_generated.go'
  - '**/*.pb.go'
---
id: no-comments-rust
language: Rust
severity: error
message: 주석과 doc 주석은 금지됩니다. 의도는 이름·타입·테스트로, 안전 조건은 타입·assert·테스트로 옮기세요.
note: |
  주석은 강제력이 없고 코드보다 먼저 낡으며, 임시방편을 정당화하는 자리가 됩니다.
  lint 예외는 주석이 아니라 #[allow(lint, reason = "...")] 또는 #[expect(...)] 속성으로 남깁니다.
  clap 같은 derive가 읽던 doc 주석은 #[command(about = "...")]·#[arg(help = "...")] 속성으로 옮깁니다.
rule:
  any:
    - kind: line_comment
    - kind: block_comment
ignores:
  - 'docs/**'
  - '**/testdata/**'
  - '**/fixtures/**'
