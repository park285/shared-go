id: no-comments-javascript
language: JavaScript
severity: error
message: 주석과 설명형 JSDoc은 금지됩니다. 의도는 이름·테스트로 옮기세요.
note: |
  허용되는 것은 기계 지시문뿐입니다: // @ts-check, // @ts-expect-error, // eslint-..., /// <reference ...>,
  그리고 tsc checkJs가 읽는 타입 전용 JSDoc(@param {T} name, @returns {T}, @type, @typedef, @template, @import, @callback)입니다.
  타입 전용 JSDoc에는 설명 문장을 붙이지 않습니다. 태그가 하나면 /** @type {T} */ 한 줄, 여럿이면 줄마다 " * @tag"입니다.
  타입 표기의 중괄호는 세 단계까지 중첩할 수 있습니다.
rule:
  kind: comment
  not:
    regex: '^(?:// ?@ts-|// ?eslint-|/\* ?eslint|/// <reference |/\*\* (?:@(?:param|property) \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} (?:[\w.$]+|\[[\w.$]+(?:=[^\]\n]*)?\])|@(?:type|returns|satisfies|this|enum) \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\}|@typedef \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} [\w$]+|@template (?:\{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} )?[\w$]+(?:, [\w$]+)*|@callback [\w$]+|@import \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} from ["''][^"''\n]+["'']|@overload|@override) \*/$|/\*\*\n(?:[ \t]* \* (?:@(?:param|property) \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} (?:[\w.$]+|\[[\w.$]+(?:=[^\]\n]*)?\])|@(?:type|returns|satisfies|this|enum) \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\}|@typedef \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} [\w$]+|@template (?:\{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} )?[\w$]+(?:, [\w$]+)*|@callback [\w$]+|@import \{(?:[^{}\n]|\{(?:[^{}\n]|\{[^{}\n]*\})*\})*\} from ["''][^"''\n]+["'']|@overload|@override)\n)+[ \t]* \*/$)'
ignores:
  - 'docs/**'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/node_modules/**'
---
id: no-comments-typescript
