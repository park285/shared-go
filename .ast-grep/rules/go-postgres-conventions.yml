id: no-pgx-begin-func
language: Go
severity: error
message: pgx.BeginFunc·BeginTxFunc 대신 Begin(또는 BeginTx) 뒤에 defer pgxdb.RollbackDeferred(ctx, tx, &err)를 두고 tx.Commit(ctx)로 끝내세요. hololive는 dbx.InPgxTx·InPgxTxOptions를 씁니다. 저장점은 tx.Begin과 pgxdb.Rollback으로 처리합니다.
note: |
  BeginFunc는 호출자 ctx로 롤백합니다. ctx가 취소되거나 만료되면 ROLLBACK을 보내지 못해 연결이 버려지고, fn이 오류를 낸 경우에는 롤백 실패를 버립니다.
  pgxdb.Rollback은 취소와 분리된 5초 컨텍스트로 롤백하고 이미 닫힌 트랜잭션은 성공으로 처리합니다.
rule:
  any:
    - pattern:
        context: 'func f() { pgx.BeginFunc($$$) }'
        selector: call_expression
    - pattern:
        context: 'func f() { pgx.BeginTxFunc($$$) }'
        selector: call_expression
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
---
id: no-direct-pgx-rollback
language: Go
severity: error
message: 트랜잭션과 저장점 롤백은 pgxdb.Rollback(ctx, tx) 또는 defer pgxdb.RollbackDeferred(ctx, tx, &err)로 합니다.
note: |
  호출자 ctx로 직접 Rollback하면 취소되거나 만료된 ctx에서 ROLLBACK이 전송되지 않아 연결을 잃고, pgx.ErrTxClosed를 호출부마다 따로 걸러야 합니다.
rule:
  pattern:
    context: 'func f() { $TX.Rollback($CTX) }'
    selector: call_expression
constraints:
  CTX:
    not:
      any:
        - kind: interpreted_string_literal
        - kind: raw_string_literal
        - kind: int_literal
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
  - 'postgres/pgxdb/**'
---
id: no-raw-pgxpool-new
language: Go
severity: error
message: 운영 코드의 PostgreSQL 풀은 pgxdb.OpenPool 또는 pgxdb.OpenPoolDSN으로 엽니다.
note: |
  pgxpool.New·NewWithConfig는 공통 풀 검증을 건너뜁니다. 연결 수·수명·유휴 시간 필수값, 제어 연결 예약 정책, 초기 연결 시간 제한과 ping 확인이 빠집니다.
rule:
  any:
    - pattern:
        context: 'func f() { pgxpool.New($$$) }'
        selector: call_expression
    - pattern:
        context: 'func f() { pgxpool.NewWithConfig($$$) }'
        selector: call_expression
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
  - 'postgres/pgxdb/**'
  - 'scripts/verify/**'
