id: no-inline-sql-in-go
language: Go
severity: error
message: Go 문자열에 SQL을 직접 쓰지 않습니다. 패키지의 queries/*.sql로 옮기고 //go:embed와 저장소의 SQL 로더(shared-go sqlutil.MustQuery, hololive-shared sqlassets.MustReader)로 읽으세요. 식별자가 바뀌는 SQL은 {{table}} 같은 자리표시자를 둔 queries/*.sql.tpl에 둡니다.
note: |
  Go 문자열 안의 SQL은 SQL 주석 금지 검사와 SQL 파일 단위 검토·검색에서 빠지고, MustQuery가 시작 시점에 하는 누락·빈 쿼리 검증도 받지 못합니다.
  .sql.tpl의 자리표시자는 pgx.Identifier{...}.Sanitize() 같은 검증된 식별자로만 치환합니다.
utils:
  string-literal:
    any:
      - kind: interpreted_string_literal
      - kind: raw_string_literal
  sql-argument:
    any:
      - nthChild: 1
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^Queue$'
      - nthChild: 2
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(ExecContext|QueryContext|QueryRowContext|PrepareContext|ExecParams)$'
      - nthChild: 2
        inside:
          kind: argument_list
          has:
            nthChild: 1
            regex: '(?i)(^|[^a-z0-9_])[a-z0-9_]*ctx([^a-z0-9_]|$)|context'
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Exec|Query|QueryRow)$'
      - nthChild: 3
        inside:
          kind: argument_list
          all:
            - has:
                nthChild: 1
                regex: '(?i)(^|[^a-z0-9_])[a-z0-9_]*ctx([^a-z0-9_]|$)|context'
            - has:
                nthChild: 2
                matches: string-literal
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^Prepare$'
      - nthChild: 4
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^pgxscan$'
                - has:
                    field: field
                    regex: '^(Select|Get)$'
      - nthChild: 4
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^dbx$'
                - has:
                    field: field
                    regex: '^ExecSQL$'
      - nthChild: 5
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^dbx$'
                - has:
                    field: field
                    regex: '^(SelectSQL|GetSQL)$'
  weak-sql-argument:
    any:
      - nthChild: 1
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Exec|Query|QueryRow|Prepare)$'
      - nthChild: 2
        inside:
          kind: argument_list
          not:
            has:
              nthChild: 1
              regex: '(?i)(sql|query|stmt|statement)'
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Exec|Query|QueryRow)$'
      - nthChild: 3
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^Prepare$'
      - matches: sql-named-binding
  sql-binding-name:
    regex: '(?i)sql$'
  sql-plain-binding-name:
    all:
      - regex: '(?i)sql$'
      - not:
          regex: '(^|[._])(?i:postgresql|mysql|nosql|mssql)$|[A-Za-z0-9](PostgreSQL|PostgreSql|Postgresql|MySQL|MySql|Mysql)$'
  sql-named-binding:
    any:
      - nthChild: 1
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 1
              matches: sql-binding-name
      - nthChild: 2
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 2
              matches: sql-binding-name
      - nthChild: 3
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 3
              matches: sql-binding-name
      - nthChild: 4
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 4
              matches: sql-binding-name
      - nthChild: 5
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 5
              matches: sql-binding-name
      - nthChild: 6
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 6
              matches: sql-binding-name
      - nthChild: 
          position: n+7
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              matches: sql-binding-name
      - nthChild: 1
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 1
                matches: sql-binding-name
      - nthChild: 2
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 2
                matches: sql-binding-name
      - nthChild: 3
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 3
                matches: sql-binding-name
      - nthChild: 4
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 4
                matches: sql-binding-name
      - nthChild: 5
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 5
                matches: sql-binding-name
      - nthChild: 6
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 6
                matches: sql-binding-name
      - nthChild: 
          position: n+7
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                matches: sql-binding-name
  sql-plain-named-binding:
    any:
      - nthChild: 1
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 1
              matches: sql-plain-binding-name
      - nthChild: 2
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 2
              matches: sql-plain-binding-name
      - nthChild: 3
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 3
              matches: sql-plain-binding-name
      - nthChild: 4
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 4
              matches: sql-plain-binding-name
      - nthChild: 5
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 5
              matches: sql-plain-binding-name
      - nthChild: 6
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              nthChild: 6
              matches: sql-plain-binding-name
      - nthChild: 
          position: n+7
        inside:
          kind: expression_list
          inside:
            any:
              - kind: const_spec
              - kind: var_spec
            has:
              kind: identifier
              matches: sql-plain-binding-name
      - nthChild: 1
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 1
                matches: sql-plain-binding-name
      - nthChild: 2
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 2
                matches: sql-plain-binding-name
      - nthChild: 3
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 3
                matches: sql-plain-binding-name
      - nthChild: 4
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 4
                matches: sql-plain-binding-name
      - nthChild: 5
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 5
                matches: sql-plain-binding-name
      - nthChild: 6
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                nthChild: 6
                matches: sql-plain-binding-name
      - nthChild: 
          position: n+7
        inside:
          kind: expression_list
          inside:
            field: right
            any:
              - kind: short_var_declaration
              - kind: assignment_statement
            has:
              field: left
              has:
                matches: sql-plain-binding-name
  sql-named-arg:
    any:
      - matches: sql-named-operand
      - has:
          stopBy:
            not:
              matches: sql-arg-path
          matches: sql-named-operand
  sql-strong-fragment:
    any:
      - matches: sql-clause-phrase
      - matches: sql-nulls-order
      - regex: '\$[0-9]'
      - kind: interpreted_string_literal
        regex: '(\b|\\[nrt])(BY|FROM|JOIN|INTO|UPDATE|TABLE|ON|SET|WHERE|AND|OR|NOT|IN|IS|LIKE|ILIKE|SELECT|DISTINCT|AS|USING|RETURNING|HAVING|WHEN|THEN|ELSE|CASE|VALUES|EXISTS|ANY|ALL)(\s|\\[nrt])*["`]$'
      - kind: raw_string_literal
        regex: '(\b)(BY|FROM|JOIN|INTO|UPDATE|TABLE|ON|SET|WHERE|AND|OR|NOT|IN|IS|LIKE|ILIKE|SELECT|DISTINCT|AS|USING|RETURNING|HAVING|WHEN|THEN|ELSE|CASE|VALUES|EXISTS|ANY|ALL)(\s)*["`]$'
      - kind: interpreted_string_literal
        regex: '^["`](\s|\\[nrt])*(ASC|DESC|NULLS(\s|\\[nrt])+(FIRST|LAST)|IS)\b'
      - kind: raw_string_literal
        regex: '^["`](\s)*(ASC|DESC|NULLS(\s)+(FIRST|LAST)|IS)\b'
  sql-quoted-format:
    all:
      - matches: string-literal
      - not:
          any:
            - kind: interpreted_string_literal
              regex: '((\b|\\[nrt])(BY|FROM|JOIN|INTO|UPDATE|TABLE|ON|SET|WHERE|AND|OR|NOT|IN|IS|LIKE|ILIKE|SELECT|DISTINCT|AS|USING|RETURNING|HAVING|WHEN|THEN|ELSE|CASE|VALUES|EXISTS|ANY|ALL)|(?i)(\b|\\[nrt])((order|group|partition)(\s|\\[nrt])+by|insert(\s|\\[nrt])+into|delete(\s|\\[nrt])+from|join))(\s|\\[nrt])+%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
            - kind: raw_string_literal
              regex: '((\b)(BY|FROM|JOIN|INTO|UPDATE|TABLE|ON|SET|WHERE|AND|OR|NOT|IN|IS|LIKE|ILIKE|SELECT|DISTINCT|AS|USING|RETURNING|HAVING|WHEN|THEN|ELSE|CASE|VALUES|EXISTS|ANY|ALL)|(?i)(\b)((order|group|partition)(\s)+by|insert(\s)+into|delete(\s)+from|join))(\s)+%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
      - not:
          any:
            - kind: interpreted_string_literal
              regex: '%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q(\s|\\[nrt])+(ASC|DESC|(?i:nulls)(\s|\\[nrt])+(?i:first|last)|IS(\s|\\[nrt])+(NOT(\s|\\[nrt])+)?(NULL|TRUE|FALSE|UNKNOWN|DISTINCT))\b'
            - kind: raw_string_literal
              regex: '%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q(\s)+(ASC|DESC|(?i:nulls)(\s)+(?i:first|last)|IS(\s)+(NOT(\s)+)?(NULL|TRUE|FALSE|UNKNOWN|DISTINCT))\b'
      - not:
          regex: '\$[0-9]'
      - not:
          matches: sql-clause-phrase
  sql-quoted-diagnostic-call:
    all:
      - kind: call_expression
      - has:
          field: function
          regex: '^fmt\.Sprintf$'
      - has:
          field: arguments
          all:
            - has:
                nthChild: 1
                matches: sql-quoted-format
            - has:
                stopBy:
                  not:
                    matches: sql-arg-path
                matches: sql-named-operand
            - any:
                - has:
                    nthChild: 1
                    regex: '^["`]([^%]|%%|%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q)*["`]$'
                - all:
                    - not:
                        has:
                          nthChild: 1
                          regex: '%[-+# 0-9.]*\['
                    - any:
                        - not:
                            has:
                              nthChild: 2
                              matches: sql-named-arg
                        - has:
                            nthChild: 1
                            regex: '^["`]([^%]|%%)*%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
                    - any:
                        - not:
                            has:
                              nthChild: 3
                              matches: sql-named-arg
                        - has:
                            nthChild: 1
                            regex: '^["`]([^%]|%%)*(%[-+# 0-9.]*[a-zA-Z]([^%]|%%)*){1}%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
                    - any:
                        - not:
                            has:
                              nthChild: 4
                              matches: sql-named-arg
                        - has:
                            nthChild: 1
                            regex: '^["`]([^%]|%%)*(%[-+# 0-9.]*[a-zA-Z]([^%]|%%)*){2}%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
                    - any:
                        - not:
                            has:
                              nthChild: 5
                              matches: sql-named-arg
                        - has:
                            nthChild: 1
                            regex: '^["`]([^%]|%%)*(%[-+# 0-9.]*[a-zA-Z]([^%]|%%)*){3}%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
                    - any:
                        - not:
                            has:
                              nthChild: 6
                              matches: sql-named-arg
                        - has:
                            nthChild: 1
                            regex: '^["`]([^%]|%%)*(%[-+# 0-9.]*[a-zA-Z]([^%]|%%)*){4}%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
                    - any:
                        - not:
                            has:
                              nthChild: 7
                              matches: sql-named-arg
                        - has:
                            nthChild: 1
                            regex: '^["`]([^%]|%%)*(%[-+# 0-9.]*[a-zA-Z]([^%]|%%)*){5}%[-+# 0-9.]*(\[[0-9]+\])?[-+# 0-9.]*q'
                    - not:
                        has:
                          nthChild:
                            position: n+8
                          matches: sql-named-arg
      - not:
          inside:
            stopBy:
              not:
                matches: sql-text-path
            all:
              - matches: sql-builder-call
              - has:
                  field: arguments
                  has:
                    stopBy:
                      not:
                        matches: sql-arg-path
                    matches: sql-named-operand
  sql-builder-call:
    kind: call_expression
    has:
      field: function
      any:
        - kind: selector_expression
          all:
            - has:
                field: operand
                regex: '^(fmt|strings)$'
            - has:
                field: field
                regex: '^(Sprintf|Sprint|Join)$'
        - kind: identifier
          regex: '^string$'
  sql-plain-builder:
    any:
      - kind: binary_expression
      - kind: parenthesized_expression
      - matches: sql-builder-call
  sql-plain-builder-path:
    any:
      - matches: sql-plain-builder
      - kind: argument_list
        inside:
          matches: sql-builder-call
      - kind: literal_element
      - kind: literal_value
      - kind: composite_literal
  sql-statement-text:
    any:
      - kind: interpreted_string_literal
        regex: '(?i)^["`](\s|\\[nrt])*(\((\s|\\[nrt])*)*((BEGIN|COMMIT|END|ROLLBACK|ABORT|CHECKPOINT|ANALYZE|VACUUM)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|SELECT([\s(*]|\\[nrt])|INSERT(\s|\\[nrt])+INTO(\s|\\[nrt])|UPDATE(\s|\\[nrt])+(ONLY(\s|\\[nrt])+)?([a-z_0-9.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])([A-Za-z0-9_.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])*((\s|\\[nrt])+(AS(\s|\\[nrt])+)?[a-z_][a-z0-9_]*)?(\s|\\[nrt])+SET(\s|\\[nrt])|DELETE(\s|\\[nrt])+FROM(\s|\\[nrt])|(DROP|REASSIGN)(\s|\\[nrt])+OWNED(\s|\\[nrt])+BY(\s|\\[nrt])|TABLE(\s|\\[nrt])+(ONLY(\s|\\[nrt])+)?([a-z_0-9.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])([A-Za-z0-9_.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])*(\s|\\[nrt])*["`;]|COMMENT(\s|\\[nrt])+ON(\s|\\[nrt])|(CREATE((\s|\\[nrt])+OR(\s|\\[nrt])+REPLACE)?((\s|\\[nrt])+(UNIQUE|TEMP|TEMPORARY|UNLOGGED|MATERIALIZED))*|ALTER|DROP)(\s|\\[nrt])+(TABLE|INDEX|VIEW|FUNCTION|PROCEDURE|SCHEMA|ROLE|USER|SEQUENCE|TYPE|DOMAIN|EXTENSION|TRIGGER|POLICY|PUBLICATION|SUBSCRIPTION|DATABASE|DEFAULT|SYSTEM|EVENT|AGGREGATE|COLLATION|OPERATOR|RULE|SERVER|STATISTICS)\b|TRUNCATE(\s|\\[nrt])+(TABLE(\s|\\[nrt])+|ONLY(\s|\\[nrt])+)?([a-z_0-9.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])([A-Za-z0-9_.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])*(\s|\\[nrt])*(["`;,(]|RESTART|CASCADE|CONTINUE)|DO(\s|\\[nrt])+(\$|LANGUAGE(\s|\\[nrt]))|VALUES(\s|\\[nrt])*\(|(ANALYZE|VACUUM)((\s|\\[nrt])+\([^)]*\)|(\s|\\[nrt])+VERBOSE)?(\s|\\[nrt])+([a-z_0-9.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])([A-Za-z0-9_.]|\\"[^"\\]+\\"|%(\[[0-9]+\])?[sqv])*(\s|\\[nrt])*["`;,(]|(GRANT|REVOKE)(\s|\\[nrt])+(SELECT|INSERT|UPDATE|DELETE|TRUNCATE|REFERENCES|TRIGGER|USAGE|EXECUTE|ALL|CONNECT|CREATE|TEMPORARY|TEMP|MAINTAIN|SET)\b|RESET(\s|\\[nrt])+(ALL|ROLE|SESSION(\s|\\[nrt])+AUTHORIZATION|[a-z_][a-z0-9_]*[_.][a-z0-9_.]*)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|DISCARD(\s|\\[nrt])+(ALL|PLANS|SEQUENCES|TEMP|TEMPORARY)\b|(NOTIFY|LISTEN|UNLISTEN)(\s|\\[nrt])+(([a-z_]|%(\[[0-9]+\])?[sqv])([a-z0-9_]|%(\[[0-9]+\])?[sqv])*|\*)(\s|\\[nrt])*["`;,(]|EXPLAIN(\s|\\[nrt])+(\(|ANALYZ