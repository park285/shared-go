  sql-builder:
    any:
      - kind: binary_expression
      - kind: parenthesized_expression
      - matches: sql-builder-call
      - matches: sql-text-transform
  sql-builder-path:
    any:
      - matches: sql-builder
      - kind: argument_list
        inside:
          any:
            - matches: sql-builder-call
            - matches: sql-text-transform
      - kind: literal_element
      - kind: literal_value
      - kind: composite_literal
  sql-concat:
    kind: binary_expression
    has:
      field: operator
      regex: '^\+$'
  sql-text-builder:
    any:
      - matches: sql-concat
      - matches: sql-builder-call
  sql-text-path:
    any:
      - matches: sql-text-builder
      - matches: sql-text-transform
      - kind: argument_list
        inside:
          matches: sql-text-transform
      - kind: parenthesized_expression
      - kind: argument_list
        inside:
          matches: sql-builder-call
      - kind: literal_element
      - kind: literal_value
      - kind: composite_literal
  sql-text-transform:
    kind: call_expression
    has:
      field: function
      regex: '^strings\.(TrimSpace|ToLower|ToUpper|ToTitle|Clone|Title)$'
  sql-binding-path:
    any:
      - matches: sql-text-path
      - kind: keyed_element
  sql-concat-path:
    any:
      - matches: sql-concat
      - kind: parenthesized_expression
  sql-named-value:
    any:
      - kind: identifier
        matches: sql-plain-binding-name
      - kind: selector_expression
        has:
          field: field
          matches: sql-plain-binding-name
  sql-named-operand:
    any:
      - matches: sql-named-value
      - kind: call_expression
        has:
          field: function
          matches: sql-named-value
      - kind: index_expression
        has:
          field: operand
          all:
            - matches: sql-named-operand
            - not:
                kind: call_expression
                has:
                  field: function
                  kind: selector_expression
                  has:
                    field: field
                    regex: '^Fields$'
      - kind: call_expression
        all:
          - has:
              field: function
              any:
                - kind: selector_expression
                  all:
                    - has:
                        field: operand
                        regex: '^strings$'
                    - has:
                        field: field
                        regex: '^(Clone|Fields|FieldsFunc|Join|Map|Repeat|Replace|ReplaceAll|Split|SplitAfter|SplitAfterN|SplitN|Title|To[A-Za-z0-9]*|Trim[A-Za-z]*)$'
                - kind: identifier
                  regex: '^string$'
          - has:
              field: arguments
              has:
                any:
                  - matches: sql-named-operand
                  - kind: composite_literal
                    has:
                      kind: literal_value
                      has:
                        kind: literal_element
                        has:
                          matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^(Sprintf|Sprint)$'
          - has:
              field: arguments
              has:
                nthChild: 1
                matches: sql-named-operand
      - kind: slice_expression
        has:
          field: operand
          matches: sql-named-operand
      - kind: unary_expression
        has:
          field: operand
          matches: sql-named-operand
      - kind: parenthesized_expression
        has:
          matches: sql-named-operand
      - kind: call_expression
        has:
          field: function
          any:
            - kind: identifier
              regex: '(?i)^must(sql|query)$'
            - kind: selector_expression
              has:
                field: field
                regex: '(?i)^must(sql|query)$'
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Replace|ReplaceAll)$'
          - has:
              field: arguments
              has:
                matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^Sprintf$'
          - has:
              field: arguments
              all:
                - has:
                    nthChild: 1
                    regex: '^["`]%[sv]'
                - has:
                    nthChild: 2
                    matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^Sprint$'
          - has:
              field: arguments
              has:
                matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^Sprintf$'
          - has:
              field: arguments
              all:
                - has:
                    nthChild: 1
                    regex: '^["`]((\s|\\[nrt]|[()])*%(\[[0-9]+\])?[sv])+(\s|\\[nrt]|[()])*["`]$'
                - has:
                    matches: sql-named-operand
  sql-arg-path:
    any:
      - kind: argument_list
      - kind: composite_literal
      - kind: literal_value
      - kind: literal_element
      - kind: parenthesized_expression
      - matches: sql-concat
  sql-fragment:
    any:
      - kind: interpreted_string_literal
        regex: '(\b|\\[nrt])(SELECT|FROM|WHERE|JOIN|ON|USING|ORDER|GROUP|BY|HAVING|LIMIT|OFFSET|FETCH|FOR|RETURNING|VALUES|SET|UNION|INTERSECT|EXCEPT|INSERT|UPDATE|DELETE|MERGE|AND|OR|NOT|IN|IS|NULL|NULLS|LIKE|ILIKE|BETWEEN|EXISTS|DISTINCT|AS|WITH|INTO|DO|CONFLICT|CASE|WHEN|THEN|ELSE|END|ASC|DESC|LATERAL|OVER|PARTITION|ANY|ALL|NOWAIT|SKIP|LOCKED|SHARE)\b|\$[0-9]'
      - kind: raw_string_literal
        regex: '(\b)(SELECT|FROM|WHERE|JOIN|ON|USING|ORDER|GROUP|BY|HAVING|LIMIT|OFFSET|FETCH|FOR|RETURNING|VALUES|SET|UNION|INTERSECT|EXCEPT|INSERT|UPDATE|DELETE|MERGE|AND|OR|NOT|IN|IS|NULL|NULLS|LIKE|ILIKE|BETWEEN|EXISTS|DISTINCT|AS|WITH|INTO|DO|CONFLICT|CASE|WHEN|THEN|ELSE|END|ASC|DESC|LATERAL|OVER|PARTITION|ANY|ALL|NOWAIT|SKIP|LOCKED|SHARE)\b|\$[0-9]'
      - matches: sql-clause-phrase
      - matches: sql-nulls-order
  sql-nulls-order:
    any:
      - kind: interpreted_string_literal
        regex: '(?i)(\b|\\[nrt])nulls(\s|\\[nrt])+(first|last)\b'
      - kind: raw_string_literal
        regex: '(?i)\bnulls\s+(first|last)\b'
  sql-clause-phrase:
    any:
      - kind: interpreted_string_literal
        regex: '(?i)(\b|\\[nrt])((for(\s|\\[nrt])+(update|share|no(\s|\\[nrt])+key(\s|\\[nrt])+update|key(\s|\\[nrt])+share)|order(\s|\\[nrt])+by|group(\s|\\[nrt])+by|on(\s|\\[nrt])+conflict|skip(\s|\\[nrt])+locked|insert(\s|\\[nrt])+into|delete(\s|\\[nrt])+from|(left|right|inner|full|cross)(\s|\\[nrt])+join|union(\s|\\[nrt])+(all|select)|fetch(\s|\\[nrt])+(first|next)((\s|\\[nrt])+(\d+|%[dsv]|\$\d+|\(([^()]|\([^()]*\))*\)))?(\s|\\[nrt])+rows?|fetch(\s|\\[nrt])+((next|prior|first|last|absolute|relative|forward|backward)((\s|\\[nrt])+(-?\d+|%[dsv]|\$\d+|all))?|all|-?\d+|%[dsv]|\$\d+)(\s|\\[nrt])+(from|in)|join(\s|\\[nrt])+([a-z_][a-z0-9_.]*|%s)((\s|\\[nrt])+(as(\s|\\[nrt])+)?[a-z_][a-z0-9_]*)?(\s|\\[nrt])+(using|on))\b|(limit|offset)(\s|\\[nrt])+(\d|%[dsv]|\$)|values(\s|\\[nrt])*\(|where(\s|\\[nrt])+[a-z_][a-z0-9_.]*(\s|\\[nrt])*(=|<|>|!=|in(\s|\\[nrt])*\(|is(\s|\\[nrt])+(not(\s|\\[nrt])+)?(null|true|false|unknown|distinct(\s|\\[nrt])+from)\b|like(\s|\\[nrt])|between(\s|\\[nrt])))'
      - kind: raw_string_literal
        regex: '(?i)(\b)((for(\s)+(update|share|no(\s)+key(\s)+update|key(\s)+share)|order(\s)+by|group(\s)+by|on(\s)+conflict|skip(\s)+locked|insert(\s)+into|delete(\s)+from|(left|right|inner|full|cross)(\s)+join|union(\s)+(all|select)|fetch(\s)+(first|next)((\s)+(\d+|%[dsv]|\$\d+|\(([^()]|\([^()]*\))*\)))?(\s)+rows?|fetch(\s)+((next|prior|first|last|absolute|relative|forward|backward)((\s)+(-?\d+|%[dsv]|\$\d+|all))?|all|-?\d+|%[dsv]|\$\d+)(\s)+(from|in)|join(\s)+([a-z_][a-z0-9_.]*|%s)((\s)+(as(\s)+)?[a-z_][a-z0-9_]*)?(\s)+(using|on))\b|(limit|offset)(\s)+(\d|%[dsv]|\$)|values(\s)*\(|where(\s)+[a-z_][a-z0-9_.]*(\s)*(=|<|>|!=|in(\s)*\(|is(\s)+(not(\s)+)?(null|true|false|unknown|distinct(\s)+from)\b|like(\s)|between(\s)))'
rule:
  any:
    - all:
        - not:
            inside:
              stopBy: end
              kind: literal_element
              nthChild: 1
              inside:
                kind: keyed_element
        - any:
            - all:
                - matches: string-literal
                - not:
                    regex: '^["`](\s|\\[nrt])*["`]$'
                - inside:
                    matches: sql-concat
                    stopBy:
                      not:
                        matches: sql-text-path
                    has:
                      stopBy:
                        not:
                          matches: sql-concat-path
                      matches: sql-named-operand
            - all:
                - matches: string-literal
                - matches: sql-fragment
                - inside:
                    all:
                      - matches: sql-builder-call
                      - has:
                          field: arguments
                          has:
                            stopBy:
                              not:
                                matches: sql-arg-path
                            matches: sql-named-operand
                    stopBy:
                      not:
                        matches: sql-text-path
                - not:
                    any:
                      - all:
                          - nthChild: 1
                          - inside:
                              kind: argument_list
                              inside:
                                matches: sql-quoted-diagnostic-call
                      - all:
                          - not:
                              matches: sql-strong-fragment
                          - inside:
                              stopBy:
                                not:
                                  matches: sql-text-path
                              matches: sql-quoted-diagnostic-call
            - all:
                - matches: string-literal
                - not:
                    regex: '^["`](\s|\\[nrt])*["`]$'
                - inside:
                    kind: assignment_statement
                    all:
                      - has:
                          field: operator
                          regex: '^\+=$'
                      - has:
                          field: left
                          has:
                            any:
                              - matches: sql-named-operand
                              - kind: unary_expression
                                has:
                                  field: operand
                                  matches: sql-named-operand
                    stopBy:
                      not:
                        any:
                          - matches: sql-text-path
                          - kind: expression_list
            - all:
                - matches: string-literal
                - not:
                    regex: '^["`](\s|\\[nrt])*["`]$'
                - any:
                    - matches: sql-plain-named-binding
                    - inside:
                        stopBy:
                          not:
                            matches: sql-binding-path
                        all:
                          - any:
                              - matches: sql-text-builder
                              - matches: sql-text-transform
                              - kind: composite_literal
                              - kind: parenthesized_expression
                          - matches: sql-plain-named-binding
            - all:
