id: no-inline-sql-in-go
language: Go
severity: error
message: Go 문자열에 SQL을 직접 쓰지 않습니다. 패키지의 queries/*.sql로 옮기고 //go:embed와 저장소의 SQL 로더(shared-go sqlutil.MustQuery, hololive-shared sqlassets.MustReader)로 읽으세요. 식별자가 바뀌는 SQL은 {{table}} 같은 자리표시자를 둔 queries/*.sql.tpl에 둡니다.
note: |
  Go 문자열 안의 SQL은 SQL 주석 금지 검사와 SQL 파일 단위 검토·검색에서 빠지고, MustQuery가 시작 시점에 하는 누락·빈 쿼리 검증도 받지 못합니다.
  .sql.tpl의 자리표시자는 pgx.Identifier{...}.Sanitize() 같은 검증된 식별자로만 치환합니다.
utils:
  string-literal:
    any:
      - kind: interpreted_string_literal
      - kind: raw_string_literal
  sql-argument:
    any:
      - nthChild: 1
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^Queue$'
      - nthChild: 2
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(ExecContext|QueryContext|QueryRowContext|PrepareContext|ExecParams)$'
      - nthChild: 2
        inside:
          kind: argument_list
          has:
            nthChild: 1
            regex: '(?i)(^|[^a-z0-9_])[a-z0-9_]*ctx([^a-z0-9_]|$)|context'
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Exec|Query|QueryRow)$'
      - nthChild: 3
        inside:
          kind: argument_list
          all:
            - has:
                nthChild: 1
                regex: '(?i)(^|[^a-z0-9_])[a-z0-9_]*ctx([^a-z0-9_]|$)|context'
            - has:
                nthChild: 2
                matches: string-literal
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^Prepare$'
      - nthChild: 4
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^pgxscan$'
                - has:
                    field: field
                    regex: '^(Select|Get)$'
      - nthChild: 4
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^dbx$'
                - has:
                    field: field
                    regex: '^ExecSQL$'
      - nthChild: 5
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^dbx$'
                - has:
                    field: field
                    regex: '^(SelectSQL|GetSQL)$'
  weak-sql-argument:
    any:
      - nthChild: 1
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Exec|Query|QueryRow|Prepare)$'
      - nthChild: 2
        inside:
          kind: argument_list
          not:
            has:
              nthChild: 1
              regex: '(?i)(sql|query|stmt|statement)'
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Exec|Query|QueryRow)$'
      - nthChild: 3
        inside:
          kind: argument_list
          inside:
            kind: call_expression
            has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^Prepare$'
  sql-builder-call:
    kind: call_expression
    has:
      field: function
      any:
        - kind: selector_expression
          all:
            - has:
                field: operand
                regex: '^(fmt|strings)$'
            - has:
                field: field
                regex: '^(Sprintf|Sprint|Join)$'
        - kind: identifier
          regex: '^string$'
  sql-builder:
    any:
      - kind: binary_expression
      - kind: parenthesized_expression
      - matches: sql-builder-call
  sql-builder-path:
    any:
      - matches: sql-builder
      - kind: argument_list
        inside:
          matches: sql-builder-call
      - kind: literal_element
      - kind: literal_value
      - kind: composite_literal
  sql-concat:
    kind: binary_expression
    has:
      field: operator
      regex: '^\+$'
  sql-text-builder:
    any:
      - matches: sql-concat
      - matches: sql-builder-call
  sql-text-path:
    any:
      - matches: sql-text-builder
      - kind: parenthesized_expression
      - kind: argument_list
        inside:
          matches: sql-builder-call
      - kind: literal_element
      - kind: literal_value
      - kind: composite_literal
  sql-concat-path:
    any:
      - matches: sql-concat
      - kind: parenthesized_expression
  sql-named-value:
    any:
      - kind: identifier
        regex: '(?i)sql$'
      - kind: selector_expression
        has:
          field: field
          regex: '(?i)sql$'
  sql-named-operand:
    any:
      - matches: sql-named-value
      - kind: call_expression
        has:
          field: function
          matches: sql-named-value
      - kind: index_expression
        has:
          field: operand
          all:
            - matches: sql-named-operand
            - not:
                kind: call_expression
                has:
                  field: function
                  kind: selector_expression
                  has:
                    field: field
                    regex: '^(Fields|FieldsFunc)$'
      - kind: call_expression
        all:
          - has:
              field: function
              any:
                - kind: selector_expression
                  all:
                    - has:
                        field: operand
                        regex: '^strings$'
                    - has:
                        field: field
                        regex: '^(Clone|Fields|FieldsFunc|Join|Map|Repeat|Replace|ReplaceAll|Split|SplitAfter|SplitAfterN|SplitN|Title|To[A-Za-z0-9]*|Trim[A-Za-z]*)$'
                - kind: identifier
                  regex: '^string$'
          - has:
              field: arguments
              has:
                any:
                  - matches: sql-named-operand
                  - kind: composite_literal
                    has:
                      kind: literal_value
                      has:
                        kind: literal_element
                        has:
                          matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^(Sprintf|Sprint)$'
          - has:
              field: arguments
              has:
                nthChild: 1
                matches: sql-named-operand
      - kind: slice_expression
        has:
          field: operand
          matches: sql-named-operand
      - kind: unary_expression
        has:
          field: operand
          matches: sql-named-operand
      - kind: parenthesized_expression
        has:
          matches: sql-named-operand
      - kind: call_expression
        has:
          field: function
          any:
            - kind: identifier
              regex: '(?i)^must(sql|query)$'
            - kind: selector_expression
              has:
                field: field
                regex: '(?i)^must(sql|query)$'
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              has:
                field: field
                regex: '^(Replace|ReplaceAll)$'
          - has:
              field: arguments
              has:
                matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^Sprintf$'
          - has:
              field: arguments
              all:
                - has:
                    nthChild: 1
                    regex: '^["`]%[sv]'
                - has:
                    nthChild: 2
                    matches: sql-named-operand
      - kind: call_expression
        all:
          - has:
              field: function
              kind: selector_expression
              all:
                - has:
                    field: operand
                    regex: '^fmt$'
                - has:
                    field: field
                    regex: '^Sprint$'
          - has:
              field: arguments
              has:
                matches: sql-named-operand
  sql-arg-path:
    any:
      - kind: argument_list
      - kind: composite_literal
      - kind: literal_value
      - kind: literal_element
      - kind: parenthesized_expression
      - matches: sql-concat
  sql-fragment:
    any:
      - regex: '(\b|\\[nrt])(SELECT|FROM|WHERE|JOIN|ON|USING|ORDER|GROUP|BY|HAVING|LIMIT|OFFSET|FETCH|FOR|RETURNING|VALUES|SET|UNION|INTERSECT|EXCEPT|INSERT|UPDATE|DELETE|MERGE|AND|OR|NOT|IN|IS|NULL|LIKE|ILIKE|BETWEEN|EXISTS|DISTINCT|AS|WITH|INTO|DO|CONFLICT|CASE|WHEN|THEN|ELSE|END|ASC|DESC|LATERAL|OVER|PARTITION|ANY|ALL|NOWAIT|SKIP|LOCKED|SHARE)\b|\$[0-9]'
      - regex: '(?i)(\b|\\[nrt])((for(\s|\\[nrt])+(update|share|no(\s|\\[nrt])+key(\s|\\[nrt])+update|key(\s|\\[nrt])+share)|order(\s|\\[nrt])+by|group(\s|\\[nrt])+by|on(\s|\\[nrt])+conflict|skip(\s|\\[nrt])+locked|insert(\s|\\[nrt])+into|delete(\s|\\[nrt])+from|(left|right|inner|full|cross)(\s|\\[nrt])+join|union(\s|\\[nrt])+(all|select)|fetch(\s|\\[nrt])+(first|next)((\s|\\[nrt])+(\d+|%[dv]|\$\d+|\([^)]*\)))?(\s|\\[nrt])+rows?|fetch(\s|\\[nrt])+(next|prior|first|last|absolute|relative|forward|backward)((\s|\\[nrt])+(-?\d+|%[dv]|\$\d+|all))?(\s|\\[nrt])+(from|in)|join(\s|\\[nrt])+([a-z_][a-z0-9_.]*|%s)((\s|\\[nrt])+(as(\s|\\[nrt])+)?[a-z_][a-z0-9_]*)?(\s|\\[nrt])+(using|on))\b|(limit|offset)(\s|\\[nrt])+(\d|%[dv]|\$)|values(\s|\\[nrt])*\(|where(\s|\\[nrt])+[a-z_][a-z0-9_.]*(\s|\\[nrt])*(=|<|>|!=|in(\s|\\[nrt])*\(|is(\s|\\[nrt])+(not(\s|\\[nrt])+)?(null|true|false|unknown|distinct(\s|\\[nrt])+from)\b|like(\s|\\[nrt])|between(\s|\\[nrt])))'
rule:
  any:
    - all:
        - matches: string-literal
        - not:
            regex: '^["`](\s|\\[nrt])*["`]$'
        - inside:
            matches: sql-concat
            stopBy:
              not:
                matches: sql-text-path
            has:
              stopBy:
                not:
                  matches: sql-concat-path
              matches: sql-named-operand
    - all:
        - matches: string-literal
        - matches: sql-fragment
        - inside:
            all:
              - matches: sql-builder-call
              - not:
                  has:
                    field: arguments
                    has:
                      nthChild: 1
                      matches: string-literal
                      regex: '%q'
              - has:
                  field: arguments
                  has:
                    stopBy:
                      not:
                        matches: sql-arg-path
                    matches: sql-named-operand
            stopBy:
              not:
                matches: sql-text-path
    - all:
        - matches: string-literal
        - not:
            regex: '^["`](\s|\\[nrt])*["`]$'
        - inside:
            kind: assignment_statement
            all:
              - has:
                  field: operator
                  regex: '^\+=$'
              - has:
                  field: left
                  has:
                    any:
                      - matches: sql-named-operand
                      - kind: unary_expression
                        has:
                          field: operand
                          matches: sql-named-operand
            stopBy:
              not:
                any:
                  - matches: sql-text-path
                  - kind: expression_list
    - matches: string-literal
      regex: '^["`](\s|\\[nrt])*(\((\s|\\[nrt])*)*(SELECT([\s(*]|\\[nrt])|INSERT\s+INTO\s|UPDATE\s+[a-z0-9_."]+(\s+(AS\s+)?[a-z_][a-z0-9_]*)?\s+SET\s|DELETE\s+FROM\s|(DROP|REASSIGN)\s+OWNED\s+BY\s|TABLE\s+(ONLY\s+)?[a-z_][a-z0-9_.]*\s*["`;]|(CREATE(\s+OR\s+REPLACE)?(\s+(UNIQUE|TEMP|TEMPORARY|UNLOGGED|MATERIALIZED))*|ALTER|DROP)\s+(TABLE|INDEX|VIEW|FUNCTION|PROCEDURE|SCHEMA|ROLE|USER|SEQUENCE|TYPE|DOMAIN|EXTENSION|TRIGGER|POLICY|PUBLICATION|SUBSCRIPTION|DATABASE|DEFAULT|SYSTEM|EVENT|AGGREGATE|COLLATION|OPERATOR|RULE|SERVER|STATISTICS)\b|TRUNCATE\s+(TABLE\s+|ONLY\s+)?[a-z_][a-z0-9_.]*\s*(["`;,(]|RESTART|CASCADE|CONTINUE)|DO\s+(\$|LANGUAGE\s)|VALUES\s*\(|(ANALYZE|VACUUM)(\s+\([^)]*\)|\s+VERBOSE)?\s+[a-z_][a-z0-9_.]*\s*["`;,(]|(GRANT|REVOKE)\s+(SELECT|INSERT|UPDATE|DELETE|TRUNCATE|REFERENCES|TRIGGER|USAGE|EXECUTE|ALL|CONNECT|CREATE|TEMPORARY|TEMP|MAINTAIN|SET)\b|RESET\s+(ALL|ROLE|SESSION\s+AUTHORIZATION|[a-z_][a-z0-9_]*[_.][a-z0-9_.]*)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|DISCARD\s+(ALL|PLANS|SEQUENCES|TEMP|TEMPORARY)\b|(NOTIFY|LISTEN|UNLISTEN)\s+([a-z_][a-z0-9_]*|\*)\s*["`;,(]|EXPLAIN\s+(\(|ANALYZE\s|VERBOSE\s|SELECT\s|INSERT\s|UPDATE\s|DELETE\s|WITH\s)|MERGE\s+INTO\s|COPY\s+[a-z_][a-z0-9_.]*\s*(\(|FROM\s|TO\s)|START\s+TRANSACTION\b|SAVEPOINT\s|RELEASE\s+SAVEPOINT\s|ROLLBACK\s+TO\s|(COMMIT|ROLLBACK)\s+PREPARED\s|PREPARE\s+TRANSACTION\s|CALL\s+[a-z_][a-z0-9_.]*\s*\(|REINDEX\s+(\(|TABLE|INDEX|SCHEMA|DATABASE|SYSTEM)\b|REFRESH\s+MATERIALIZED\s|WITH\s+(RECURSIVE\s+)?[a-z_]+|LOCK\s+TABLE\s|LOCK\s+(ONLY\s+)?[a-z0-9_."]+\s+(IN\s+[A-Z ]+\s+MODE\b|NOWAIT\b)|SET\s+(LOCAL|SESSION|ROLE)\s|SET\s+([a-z_][a-z0-9_.]*|[A-Z][a-z]+([A-Z][a-z]+)+)\s*(=|TO\s)|SET\s+[A-Z][A-Z0-9]*(_[A-Z0-9]+)+(\s+TO\s|\s+=\s*(''[^'']*''|[0-9]+|%[dsv]|[A-Za-z_][A-Za-z0-9_$]*)(\s*,\s*(''[^'']*''|[0-9]+|%[dsv]|[A-Za-z_][A-Za-z0-9_$]*))*(\s|\\[nrt])*;?(\s|\\[nrt])*["`]$)|SET\s+[A-Za-z][A-Za-z0-9_.]*(\s*=|\s+TO)\s*(''[^'']*''|DEFAULT)(\s|\\[nrt])*;?(\s|\\[nrt])*["`]$|SHOW\s+(ALL|[a-z_][a-z0-9_]*[_.][a-z0-9_.]*)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|COMMENT\s+ON\s+(TABLE|COLUMN|INDEX|SCHEMA|ROLE|FUNCTION|PROCEDURE|VIEW|MATERIALIZED\s+VIEW|SEQUENCE|TYPE|DOMAIN|EXTENSION|TRIGGER|POLICY|DATABASE|CONSTRAINT)\s)'
    - all:
        - matches: string-literal
        - any:
            - matches: sql-argument
            - not:
                regex: '^["`](\s|\\[nrt])*["`]$'
              inside:
                stopBy:
                  not:
                    matches: sql-builder-path
                all:
                  - matches: sql-builder
                  - matches: sql-argument
    - all:
        - matches: string-literal
        - regex: '(?i)^["`](\s|\\[nrt])*(\((\s|\\[nrt])*)*((BEGIN|COMMIT|END|ROLLBACK|ABORT|CHECKPOINT|ANALYZE|VACUUM)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|SELECT([\s(*]|\\[nrt])|INSERT\s+INTO\s|UPDATE\s+[a-z0-9_."]+(\s+(AS\s+)?[a-z_][a-z0-9_]*)?\s+SET\s|DELETE\s+FROM\s|(DROP|REASSIGN)\s+OWNED\s+BY\s|TABLE\s+(ONLY\s+)?[a-z_][a-z0-9_.]*\s*["`;]|COMMENT\s+ON\s|(CREATE(\s+OR\s+REPLACE)?(\s+(UNIQUE|TEMP|TEMPORARY|UNLOGGED|MATERIALIZED))*|ALTER|DROP)\s+(TABLE|INDEX|VIEW|FUNCTION|PROCEDURE|SCHEMA|ROLE|USER|SEQUENCE|TYPE|DOMAIN|EXTENSION|TRIGGER|POLICY|PUBLICATION|SUBSCRIPTION|DATABASE|DEFAULT|SYSTEM|EVENT|AGGREGATE|COLLATION|OPERATOR|RULE|SERVER|STATISTICS)\b|TRUNCATE\s+(TABLE\s+|ONLY\s+)?[a-z_][a-z0-9_.]*\s*(["`;,(]|RESTART|CASCADE|CONTINUE)|DO\s+(\$|LANGUAGE\s)|VALUES\s*\(|(ANALYZE|VACUUM)(\s+\([^)]*\)|\s+VERBOSE)?\s+[a-z_][a-z0-9_.]*\s*["`;,(]|(GRANT|REVOKE)\s+(SELECT|INSERT|UPDATE|DELETE|TRUNCATE|REFERENCES|TRIGGER|USAGE|EXECUTE|ALL|CONNECT|CREATE|TEMPORARY|TEMP|MAINTAIN|SET)\b|RESET\s+(ALL|ROLE|SESSION\s+AUTHORIZATION|[a-z_][a-z0-9_]*[_.][a-z0-9_.]*)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|DISCARD\s+(ALL|PLANS|SEQUENCES|TEMP|TEMPORARY)\b|(NOTIFY|LISTEN|UNLISTEN)\s+([a-z_][a-z0-9_]*|\*)\s*["`;,(]|EXPLAIN\s+(\(|ANALYZE\s|VERBOSE\s|SELECT\s|INSERT\s|UPDATE\s|DELETE\s|WITH\s)|MERGE\s+INTO\s|COPY\s+[a-z_][a-z0-9_.]*\s*(\(|FROM\s|TO\s)|START\s+TRANSACTION\b|SAVEPOINT\s|RELEASE\s+SAVEPOINT\s|ROLLBACK\s+TO\s|(COMMIT|ROLLBACK)\s+PREPARED\s|PREPARE\s+TRANSACTION\s|CALL\s+[a-z_][a-z0-9_.]*\s*\(|REINDEX\s+(\(|TABLE|INDEX|SCHEMA|DATABASE|SYSTEM)\b|REFRESH\s+MATERIALIZED\s|WITH\s+(RECURSIVE\s+)?[a-z_][a-z0-9_]*\s*(\([^)]*\)\s*)?AS(\s|\()|(BEGIN|START)\s+(TRANSACTION|WORK|ISOLATION|READ)\b|(COMMIT|END|ROLLBACK|ABORT)\s+(WORK|TRANSACTION|AND\s)|(SAVEPOINT|RELEASE(\s+SAVEPOINT)?)\s+[a-z_][a-z0-9_]*(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|SET\s+(LOCAL\s+|SESSION\s+)?([a-z_][a-z0-9_.]*\s*(=|TO\s)|ROLE\s|SESSION\s+AUTHORIZATION\s|TRANSACTION\s|CONSTRAINTS\s|TIME\s+ZONE\s|SCHEMA\s|NAMES\s)|SHOW\s+(ALL|[a-z_][a-z0-9_.]*)(\s|\\[nrt])*(;(\s|\\[nrt])*)?["`]$|LOCK\s+(TABLE\s+)?(ONLY\s+)?[a-z0-9_."]+\s*(IN\s|NOWAIT|;|["`]$)|DEALLOCATE\s+(PREPARE\s+)?ALL\b|PREPARE\s+[a-z_][a-z0-9_]*\s*(\([^)]*\)\s*)?AS\s|DECLARE\s+[a-z_][a-z0-9_]*\s+(BINARY\s+|(A|IN)SENSITIVE\s+|(NO\s+)?SCROLL\s+)*CURSOR\b)'
        - any:
            - matches: weak-sql-argument
            - not:
                regex: '^["`](\s|\\[nrt])*["`]$'
              inside:
                stopBy:
                  not:
                    matches: sql-builder-path
                all:
                  - matches: sql-builder
                  - matches: weak-sql-argument
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
---
id: no-pgx-begin-func
language: Go
severity: error
message: pgx.BeginFunc·BeginTxFunc 대신 Begin(또는 BeginTx) 뒤에 defer pgxdb.RollbackDeferred(ctx, tx, &err)를 두고 tx.Commit(ctx)로 끝내세요. hololive는 dbx.InPgxTx·InPgxTxOptions를 씁니다. 저장점은 tx.Begin과 pgxdb.Rollback으로 처리합니다.
note: |
  BeginFunc는 호출자 ctx로 롤백합니다. ctx가 취소되거나 만료되면 ROLLBACK을 보내지 못해 연결이 버려지고, fn이 오류를 낸 경우에는 롤백 실패를 버립니다.
  pgxdb.Rollback은 취소와 분리된 5초 컨텍스트로 롤백하고 이미 닫힌 트랜잭션은 성공으로 처리합니다.
rule:
  any:
    - pattern:
        context: 'func f() { pgx.BeginFunc($$$) }'
        selector: call_expression
    - pattern:
        context: 'func f() { pgx.BeginTxFunc($$$) }'
        selector: call_expression
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
---
id: no-direct-pgx-rollback
language: Go
severity: error
message: 트랜잭션과 저장점 롤백은 pgxdb.Rollback(ctx, tx) 또는 defer pgxdb.RollbackDeferred(ctx, tx, &err)로 합니다.
note: |
  호출자 ctx로 직접 Rollback하면 취소되거나 만료된 ctx에서 ROLLBACK이 전송되지 않아 연결을 잃고, pgx.ErrTxClosed를 호출부마다 따로 걸러야 합니다.
rule:
  pattern:
    context: 'func f() { $TX.Rollback($CTX) }'
    selector: call_expression
constraints:
  CTX:
    not:
      any:
        - kind: interpreted_string_literal
        - kind: raw_string_literal
        - kind: int_literal
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
  - 'postgres/pgxdb/**'
---
id: no-raw-pgxpool-new
language: Go
severity: error
message: 운영 코드의 PostgreSQL 풀은 pgxdb.OpenPool 또는 pgxdb.OpenPoolDSN으로 엽니다.
note: |
  pgxpool.New·NewWithConfig는 공통 풀 검증을 건너뜁니다. 연결 수·수명·유휴 시간 필수값, 제어 연결 예약 정책, 초기 연결 시간 제한과 ping 확인이 빠집니다.
rule:
  any:
    - pattern:
        context: 'func f() { pgxpool.New($$$) }'
        selector: call_expression
    - pattern:
        context: 'func f() { pgxpool.NewWithConfig($$$) }'
        selector: call_expression
ignores:
  - 'docs/**'
  - '**/*_test.go'
  - '**/testdata/**'
  - '**/fixtures/**'
  - '**/vendor/**'
  - '**/testsupport/**'
  - '**/*dbtest/**'
  - '**/mocks/**'
  - 'postgres/pgxdb/**'
  - 'scripts/verify/**'
