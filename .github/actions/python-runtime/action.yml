name: Python runtime
description: >-
  .python-version 이 고정한 CPython 을 actions/setup-python 으로 고르고, 그 해석기의 pip 로
  정확한 uv 를 설치한 뒤 scripts/ci/python-runner.sh 가 고른 해석기를 CI_PYTHON_BIN 으로 export 한다.
  스택 전체가 같은 바이트의 사본을 가지며 핀 값은 iris-stack tools/checks/toolchain-pins.json 이 소유한다.

inputs:
  working-directory:
    description: 저장소 checkout 디렉터리(GITHUB_WORKSPACE 기준). subdirectory checkout 에서만 지정한다.
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version-file: ${{ inputs.working-directory }}/.python-version

    - name: Install pinned uv
      shell: bash
      run: python -m pip install --disable-pip-version-check --no-cache-dir --no-deps uv==0.12.7

    - name: Initialize Python runtime
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        interpreter="$(bash scripts/ci/python-runner.sh --print-interpreter)"
        printf 'CI_PYTHON_BIN=%s\n' "$interpreter" >>"$GITHUB_ENV"
        printf 'CI_PYTHON_RUNTIME_ROOT=%s\n' "$(pwd -P)" >>"$GITHUB_ENV"
