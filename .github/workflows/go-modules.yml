name: Go modules

on:
  workflow_call:
    outputs:
      modules:
        value: ${{ jobs.list.outputs.modules }}

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.matrix.outputs.modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/python-runtime
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache: false
      - id: matrix
        shell: bash
        run: |
          modules=$(bash scripts/ci/go-tooling.sh release-modules | jq -Rnc '[inputs]')
          printf 'modules=%s\n' "$modules" >> "$GITHUB_OUTPUT"
