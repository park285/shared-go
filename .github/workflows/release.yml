name: release

on:
  push:
    tags:
      - "v2.*"
      - "core/v1.*"
      - "postgres/v1.*"
      - "transport/v1.*"
      - "openai/v1.*"
      - "sqlite/v1.*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"
  RELEASE_REPOSITORY: ${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}
  RELEASE_COMMIT: ${{ github.sha }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Validate module and exact source identity
        id: identity
        run: |
          source scripts/ci/prepare-release-bundle.sh
          release_identity "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT"
          release_source_identity
          printf 'module=%s\n' "$module_dir" >>"$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            scripts/ci/pre-push-gate.sh
            scripts/ci/go-tooling.sh
            scripts/ci/resolve-go-tool.py
            .github/workflows/ci.yml

      - name: Release gate
        run: bash scripts/ci/release-gate.sh "${{ steps.identity.outputs.module }}"

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Prepare selected module source
        id: bundle
        run: |
          source scripts/ci/prepare-release-bundle.sh
          release_identity "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT"
          bash scripts/ci/prepare-release-bundle.sh "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" dist
          mkdir -m 0700 "$RUNNER_TEMP/release-source"
          tar -xzf "dist/$archive" -C "$RUNNER_TEMP/release-source"
          printf 'artifact_name=%s\n' "$artifact_name" >>"$GITHUB_OUTPUT"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56
        with:
          path: ${{ runner.temp }}/release-source
          format: spdx-json
          output-file: dist/${{ steps.bundle.outputs.artifact_name }}.spdx.json
          syft-version: v1.57.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Finalize and verify bundle
        run: bash scripts/ci/finalize-release-bundle.sh dist "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT"

      - name: Attest bundle provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/*

      - name: Attest source SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: dist/${{ steps.bundle.outputs.artifact_name }}.tar.gz
          sbom-path: dist/${{ steps.bundle.outputs.artifact_name }}.spdx.json

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-release.sh "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" dist
