name: release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOWORK: "off"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Release gate
        run: bash scripts/ci/release-gate.sh

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout exact tag target
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: ${{ runner.temp }}/release.spdx.json
          syft-version: v1.50.0
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Prepare deterministic source bundle
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          bash scripts/ci/prepare-release-bundle.sh "$RELEASE_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" dist
          install -m 0600 "$RUNNER_TEMP/release.spdx.json" \
            "dist/${{ github.event.repository.name }}-${RELEASE_TAG}.spdx.json"

      - name: Finalize and verify bundle
        run: bash scripts/ci/finalize-release-bundle.sh dist "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}"

      - name: Attest bundle provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/*

      - name: Attest source SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz
          sbom-path: dist/${{ github.event.repository.name }}-${{ github.ref_name }}.spdx.json

      - name: Verify keyless attestations before publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signer="${{ github.repository }}/.github/workflows/release.yml"
          for artifact in dist/*; do
            gh attestation verify "$artifact" \
              --repo "${{ github.repository }}" \
              --signer-workflow "$signer" \
              --source-ref "${{ github.ref }}" \
              --source-digest "${{ github.sha }}" \
              --deny-self-hosted-runners >/dev/null
          done
          gh attestation verify "dist/${{ github.event.repository.name }}-${{ github.ref_name }}.tar.gz" \
            --repo "${{ github.repository }}" \
            --signer-workflow "$signer" \
            --source-ref "${{ github.ref }}" \
            --source-digest "${{ github.sha }}" \
            --predicate-type https://spdx.dev/Document/v2.3 \
            --deny-self-hosted-runners >/dev/null

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-release.sh "${{ github.repository }}" "${{ github.ref_name }}" "${{ github.sha }}" dist

      - name: Verify immutable release attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3 4 5; do
            if gh release verify "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          exit 1
