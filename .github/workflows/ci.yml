name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - name: Setup uv
        run: python -m pip install --disable-pip-version-check --no-cache-dir --no-deps uv==0.12.7

      - name: Initialize Python runtime
        run: |
          interpreter="$(bash scripts/ci/python-runner.sh --print-interpreter)"
          printf 'CI_PYTHON_BIN=%s\n' "$interpreter" >>"$GITHUB_ENV"
          printf 'CI_PYTHON_RUNTIME_ROOT=%s\n' "$GITHUB_WORKSPACE" >>"$GITHUB_ENV"

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Workflow secret boundary
        run: |
          bash scripts/ci/check-workflow-secrets.sh
          bash scripts/ci/check-workflow-secrets_test.sh

      - name: Workflow CI ownership contract
        run: |
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner.py
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner_test.py

      - name: Release provenance contract
        run: bash scripts/ci/check-release-provenance.sh

      - name: SQL ownership
        run: bash scripts/check-sql-ownership.sh

      - name: Hard structure gate
        run: bash scripts/ci/check-structure.sh --mode hard --format text

      - name: gofmt
        run: |
          mapfile -t files < <(find . -path './.git' -prune -o -name '*.go' -print)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt required for the following files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: bash scripts/ci/go-tooling.sh golangci-lint run -c .golangci.yml ./...

      - name: Deterministic allocation ceilings
        run: |
          go test -count=1 -run '^TestPromptGuardAllocationCeilings$' ./pkg/promptguard
          go test -count=1 -run '^TestLoggingAllocationCeilings$' ./pkg/logging

      - name: go test race
        run: go test -race -count=1 ./...
