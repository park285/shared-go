name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Workflow secret boundary
        run: bash scripts/ci/check-workflow-secrets.sh

      - name: Workflow CI ownership contract
        run: |
          python3 scripts/ci/check-workflow-ci-owner.py
          python3 scripts/ci/check-workflow-ci-owner_test.py

      - name: Release provenance contract
        run: bash scripts/ci/check-release-provenance.sh

      - name: SQL ownership
        run: bash scripts/check-sql-ownership.sh

      - name: gofmt
        run: |
          mapfile -t files < <(find . -path './.git' -prune -o -name '*.go' -print)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt required for the following files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: make lint

      - name: Deterministic guard allocation ceilings
        run: go test -count=1 -run '^TestPromptGuardAllocationCeilings$' ./pkg/promptguard

      - name: go test race
        run: go test -race -count=1 ./...
