name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Workflow secret boundary
        run: |
          bash scripts/ci/check-workflow-secrets.sh
          bash scripts/ci/check-workflow-secrets_test.sh

      - name: Workflow CI ownership contract
        run: |
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner.py
          "$CI_PYTHON_BIN" scripts/ci/check-workflow-ci-owner_test.py

      - name: Release provenance contract
        run: bash scripts/ci/check-release-provenance.sh

      - name: README package catalog contract
        run: bash scripts/ci/check-readme-package-catalog_test.sh

      - name: Module graph tidy drift
        run: GOWORK=off go mod tidy -diff

      - name: Pinned Unicode generated table
        run: GOWORK=off go run ./pkg/internal/guardtext/genconfusables.go -confusables-source ./pkg/internal/guardtext/testdata/confusables-17.0.0.txt.gz -unicode-data-baseline-source ./pkg/internal/guardtext/testdata/UnicodeData-15.0.0.txt.gz -unicode-data-source ./pkg/internal/guardtext/testdata/UnicodeData-17.0.0.txt.gz -output ./pkg/internal/guardtext/confusables_table_generated.go -check

      - name: Fast gate mutation fixtures
        run: |
          "$CI_PYTHON_BIN" scripts/ci/check-fast-gate-contract_test.py

      - name: SQL ownership
        run: bash scripts/check-sql-ownership.sh

      - name: Hard structure gate
        run: bash scripts/ci/check-structure.sh --mode hard --format text

      - name: gofmt
        run: |
          mapfile -t files < <(find . -path './.git' -prune -o -name '*.go' -print)
          if (( ${#files[@]} == 0 )); then
            exit 0
          fi
          unformatted="$(gofmt -l "${files[@]}")"
          if [[ -n "${unformatted}" ]]; then
            echo "::error::gofmt required for the following files:"
            echo "${unformatted}"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: bash scripts/ci/go-tooling.sh golangci-lint run -c .golangci.yml ./...

      - name: Deterministic allocation ceilings
        run: |
          go test -count=1 -run '^TestPromptGuardAllocationCeilings$' ./pkg/promptguard
          go test -count=1 -run '^TestLoggingAllocationCeilings$' ./pkg/logging

      - name: go test race
        run: go test -race -count=1 ./...
