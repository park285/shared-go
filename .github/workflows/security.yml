name: security

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "13 19 * * 0"

permissions:
  contents: read

env:
  GOWORK: "off"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  modules:
    uses: ./.github/workflows/go-modules.yml

  dependency-security:
    needs: modules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.modules.outputs.modules) }}
    env:
      GO_MODULE_DIR: ${{ matrix.module }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Python runtime
        uses: ./.github/actions/python-runtime

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            **/go.sum
            scripts/ci/pre-push-gate.sh
            scripts/ci/go-tooling.sh
            scripts/ci/resolve-go-tool.py
            .github/workflows/security.yml

      - name: Source integration workspace
        run: |
          work_dir=$(mktemp -d "$GITHUB_WORKSPACE/.ci-workspace.XXXXXXXX")
          bash scripts/ci/go-tooling.sh source-workspace "$work_dir/go.work"
          printf 'CI_SOURCE_WORKSPACE=%s/go.work\n' "$work_dir" >>"$GITHUB_ENV"

      - name: govulncheck
        run: env -u GNUMAKEFLAGS -u MAKEFLAGS -u MFLAGS -u MAKEOVERRIDES make vulncheck SOURCE_GOWORK="$CI_SOURCE_WORKSPACE"
