name: agent secret literal fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: agent-secret-literal-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.head_ref == 'agent/security-hardening-20260715'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: agent/security-hardening-20260715
          persist-credentials: true

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Apply literal secret redaction patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('pkg/logging/sanitize.go')
          text = source.read_text(encoding='utf-8')
          old = '''func isSecretLikeValue(v string) bool {
          \tif hasSecretLikePrefix(v) {
          \t\treturn true
          \t}
          \treturn isHighEntropyToken(v)
          }
          '''
          new = '''var secretLikeExactValues = map[string]struct{}{
          \t"access-token":  {},
          \t"access_token":  {},
          \t"api-key":       {},
          \t"api_key":       {},
          \t"private-key":   {},
          \t"private_key":   {},
          \t"refresh-token": {},
          \t"refresh_token": {},
          \t"secret-key":    {},
          \t"secret_key":    {},
          }

          func isSecretLikeValue(v string) bool {
          \tif _, ok := secretLikeExactValues[strings.ToLower(strings.TrimSpace(v))]; ok {
          \t\treturn true
          \t}
          \tif hasSecretLikePrefix(v) {
          \t\treturn true
          \t}
          \treturn isHighEntropyToken(v)
          }
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected sanitize.go patch state')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('pkg/logging/sanitize_keyvalue_test.go')
          test_text = test.read_text(encoding='utf-8')
          old_values = '''\tvalues := []string{
          \t\t"sk_live_" + "FAKEvalueNotARealStripeKey",
          '''
          new_values = '''\tvalues := []string{
          \t\t"secret-key",
          \t\t"secret_key",
          \t\t"api-key",
          \t\t"private-key",
          \t\t"access-token",
          \t\t"refresh-token",
          \t\t"sk_live_" + "FAKEvalueNotARealStripeKey",
          '''
          if test_text.count(old_values) != 1:
              raise SystemExit('unexpected sanitize_keyvalue_test.go patch state')
          test.write_text(test_text.replace(old_values, new_values, 1), encoding='utf-8')
          PY
          gofmt -w pkg/logging/sanitize.go pkg/logging/sanitize_keyvalue_test.go

      - name: Verify
        run: |
          bash scripts/ci/check-workflow-secrets_test.sh
          go test -count=1 ./...
          go vet ./...
          git diff --check

      - name: Commit verified code patch
        run: |
          git checkout HEAD -- .github/workflows/agent-secret-literal-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkg/logging/sanitize.go pkg/logging/sanitize_keyvalue_test.go
          git commit -m 'security: redact literal secret values in generic key fields'
          git push origin HEAD:agent/security-hardening-20260715
