name: promptguard-diagnostics

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-failures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      guardtext: ${{ steps.guardtext.outputs.failures }}
      promptguard: ${{ steps.promptguard.outputs.failures }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Discover guardtext failures
        id: guardtext
        shell: bash
        run: |
          set +e
          go test -race -count=1 -json ./pkg/internal/guardtext > "$RUNNER_TEMP/guardtext.json"
          status=$?
          set -e
          failures="$(jq -cs '
            . as $events
            | [$events[] | select(.Action == "fail" and .Test != null) | .Test] | unique
            | map(. as $test | {
                test: $test,
                detail: ([$events[] | select(.Action == "output" and .Test == $test) | .Output]
                  | join("")
                  | gsub("[\\r\\n\\t]+"; " ")
                  | .[0:180])
              })
          ' "$RUNNER_TEMP/guardtext.json")"
          if [[ "$status" -ne 0 && "$failures" == "[]" ]]; then
            failures='[{"test":"__PACKAGE__","detail":"package failed without a test-level failure event"}]'
          fi
          printf 'failures=%s\n' "$failures" >> "$GITHUB_OUTPUT"
      - name: Discover promptguard failures
        id: promptguard
        shell: bash
        run: |
          set +e
          go test -race -count=1 -json ./pkg/promptguard > "$RUNNER_TEMP/promptguard.json"
          status=$?
          set -e
          failures="$(jq -cs '
            . as $events
            | [$events[] | select(.Action == "fail" and .Test != null) | .Test] | unique
            | map(. as $test | {
                test: $test,
                detail: ([$events[] | select(.Action == "output" and .Test == $test) | .Output]
                  | join("")
                  | gsub("[\\r\\n\\t]+"; " ")
                  | .[0:180])
              })
          ' "$RUNNER_TEMP/promptguard.json")"
          if [[ "$status" -ne 0 && "$failures" == "[]" ]]; then
            failures='[{"test":"__PACKAGE__","detail":"package failed without a test-level failure event"}]'
          fi
          printf 'failures=%s\n' "$failures" >> "$GITHUB_OUTPUT"

  guardtext-failure-report:
    needs: discover-failures
    if: needs.discover-failures.outputs.guardtext != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        failure: ${{ fromJSON(needs.discover-failures.outputs.guardtext) }}
    name: guardtext ${{ matrix.failure.test }} — ${{ matrix.failure.detail }}
    steps:
      - name: Report captured failure
        run: printf '%s\n' '${{ toJSON(matrix.failure) }}'

  promptguard-failure-report:
    needs: discover-failures
    if: needs.discover-failures.outputs.promptguard != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        failure: ${{ fromJSON(needs.discover-failures.outputs.promptguard) }}
    name: promptguard ${{ matrix.failure.test }} — ${{ matrix.failure.detail }}
    steps:
      - name: Report captured failure
        run: printf '%s\n' '${{ toJSON(matrix.failure) }}'
