schemaVersion: 1
repo: shared-go
defaults:
  critical: { max_ns_regression_percent: 10, max_bytes_regression_percent: 10, allow_alloc_increase: false }
  hotpath: { max_ns_regression_percent: 15, max_bytes_regression_percent: 10, allow_alloc_increase: false }
  build_path: { max_ns_regression_percent: 20, max_bytes_regression_percent: 20, allow_alloc_increase: false }
  non_critical: { max_ns_regression_percent: 25, max_bytes_regression_percent: 25, allow_alloc_increase: warn }
benchmarks:
  BenchmarkPromptGuardBenignFastPath: { package: ./pkg/promptguard, class: hotpath, gate: pr }
  BenchmarkPromptGuardAggregateBoundary: { package: ./pkg/promptguard, class: hotpath, gate: pr }
  BenchmarkPromptGuardDecoderHeavy: { package: ./pkg/promptguard, class: critical, gate: pr }
  BenchmarkOutputGuardBaseline: { package: ./pkg/outputguard, class: hotpath, gate: pr }
  BenchmarkOutputGuardProtectedOverlap: { package: ./pkg/outputguard, class: hotpath, gate: pr }
  BenchmarkOutputGuardProtectedIndex: { package: ./pkg/outputguard, class: critical, gate: pr }
settings:
  mode: fail
  benchstat_alpha: 0.05
  min_count: 6
  noise_floor_ns: 50
