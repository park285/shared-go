schemaVersion: 1
repo: shared-go
defaults:
  critical: { max_ns_regression_percent: 10, max_bytes_regression_percent: 10, allow_alloc_increase: false }
  hotpath: { max_ns_regression_percent: 15, max_bytes_regression_percent: 10, allow_alloc_increase: false }
  build_path: { max_ns_regression_percent: 20, max_bytes_regression_percent: 20, allow_alloc_increase: false }
  non_critical: { max_ns_regression_percent: 25, max_bytes_regression_percent: 25, allow_alloc_increase: warn }
benchmarks:
  BenchmarkPromptGuardBenignFastPath: { package: ./pkg/promptguard, class: hotpath, gate: pr, harness_files: [pkg/promptguard/guard_benchmark_test.go] }
  BenchmarkPromptGuardAggregateBoundary: { package: ./pkg/promptguard, class: hotpath, gate: pr, harness_files: [pkg/promptguard/guard_benchmark_test.go] }
  BenchmarkPromptGuardDecoderHeavy:
    { package: ./pkg/promptguard, class: critical, gate: pr, harness_files: [pkg/promptguard/guard_benchmark_test.go], max_allocs_per_op: 64 }
  BenchmarkPromptGuardShortRuleContext:
    { package: ./pkg/promptguard, class: critical, gate: pr, harness_files: [pkg/promptguard/hardening_benchmark_test.go], max_ns_per_op: 45000, max_bytes_per_op: 3072, max_allocs_per_op: 20 }
  BenchmarkPromptGuardRollingAggregate: { package: ./pkg/promptguard, class: hotpath, gate: pr, harness_files: [pkg/promptguard/hardening_benchmark_test.go] }
  BenchmarkOutputGuardBaseline: { package: ./pkg/outputguard, class: hotpath, gate: pr, harness_files: [pkg/outputguard/outputguard_benchmark_test.go] }
  BenchmarkOutputGuardProtectedOverlap: { package: ./pkg/outputguard, class: hotpath, gate: pr, harness_files: [pkg/outputguard/outputguard_benchmark_test.go] }
  BenchmarkOutputGuardProtectedIndex: { package: ./pkg/outputguard, class: critical, gate: pr, harness_files: [pkg/outputguard/outputguard_benchmark_test.go] }
  BenchmarkOutputGuardExactNoMatch: { package: ./pkg/outputguard, class: critical, gate: pr, harness_files: [pkg/outputguard/outputguard_benchmark_test.go] }
  BenchmarkOutputGuardExactCommonPrefix: { package: ./pkg/outputguard, class: critical, gate: pr, harness_files: [pkg/outputguard/outputguard_benchmark_test.go] }
  BenchmarkOutputGuardExactRepeatedPrefix: { package: ./pkg/outputguard, class: critical, gate: pr, harness_files: [pkg/outputguard/outputguard_benchmark_test.go] }
settings:
  mode: fail
  benchstat_alpha: 0.05
  min_count: 6
  noise_floor_ns: 50
