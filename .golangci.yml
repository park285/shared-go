# Code generated by tools/lint/render-golangci.sh from tools/lint/golangci.template.yml. DO NOT EDIT.
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - containedctx
    - contextcheck
    - noctx
    - fatcontext
    - copyloopvar

    - durationcheck
    - embeddedstructfieldcheck
    - exptostd
    - intrange
    - makezero
    - mirror
    - modernize
    - recvcheck
    - unconvert
    - unqueryvet
    - usestdlibvars

    - depguard
    - forbidigo

    - errchkjson
    - errname
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil
    - wrapcheck

    - godot
    - godox
    - misspell
    - nakedret
    - nlreturn
    - nolintlint
    - predeclared
    - revive
    - sloglint
    - whitespace
    - wsl_v5
    - wastedassign

    - dupl
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - interfacebloat
    - maintidx
    - nestif
    - prealloc
    - unparam

    - testifylint
    - thelper
    - tparallel
    - usetesting

    - bidichk
    - gosec

  settings:
    depguard:
      rules:
        stack:
          list-mode: lax
          deny:
            - pkg: encoding/json$
              desc: encoding/json/v2와 encoding/json/jsontext를 직접 쓰고 raw 값은 jsontext.Value로 선언한다 (iris-stack docs/contracts/go-json-v2.md)
            - pkg: github.com/bytedance/sonic
              desc: 대체 JSON codec 대신 encoding/json/v2를 쓴다 (iris-stack docs/contracts/go-json-v2.md)
            - pkg: github.com/goccy/go-json
              desc: 대체 JSON codec 대신 encoding/json/v2를 쓴다 (iris-stack docs/contracts/go-json-v2.md)
            - pkg: github.com/json-iterator/go
              desc: 대체 JSON codec 대신 encoding/json/v2를 쓴다 (iris-stack docs/contracts/go-json-v2.md)
            - pkg: github.com/google/uuid
              desc: 표준 라이브러리 uuid 패키지를 쓴다 (iris-stack docs/contracts/go-modernization.md)
            - pkg: github.com/gofrs/uuid
              desc: 표준 라이브러리 uuid 패키지를 쓴다 (iris-stack docs/contracts/go-modernization.md)
            - pkg: unsafe$
              desc: unsafe와 cgo 사용을 금지한다
        hololive-native-exec:
          list-mode: lax
          files:
            - "**/hololive/hololive-api/**"
            - "**/hololive/hololive-shared/pkg/service/template/**"
            - "!$test"
          deny:
            - pkg: os/exec
              desc: hololive-api와 저장 template 실행기는 외부 process를 실행하지 않는다. 외부 실행이 필요한 작업은 alarm-worker·collector처럼 별도 runtime이 소유한다
            - pkg: plugin
              desc: hololive-api와 저장 template 실행기는 native plugin을 적재하지 않는다
        twentyq-boundaries:
          list-mode: lax
          files:
            - "**/twentyq-bot/**"
          deny:
            - pkg: github.com/valkey-io/valkey-go
              desc: TwentyQ 상태는 PostgreSQL(pgx, internal/twentyq/pgstate)만 쓴다. Redis/Valkey를 추가하지 않는다
            - pkg: github.com/redis/go-redis
              desc: TwentyQ 상태는 PostgreSQL(pgx, internal/twentyq/pgstate)만 쓴다. Redis/Valkey를 추가하지 않는다
            - pkg: github.com/park285/shared-go/openai
              desc: TwentyQ LLM provider는 Vertex(google.golang.org/genai) 하나다
            - pkg: github.com/openai/openai-go
              desc: TwentyQ LLM provider는 Vertex(google.golang.org/genai) 하나다

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^json\.(MatchCaseInsensitiveNames|FormatNilMapAsNull|FormatNilSliceAsNull)$
          pkg: ^encoding/json/v2$
          msg: v1 동작을 복원하는 option 대신 producer·consumer의 type/tag와 fixture를 함께 고친다 (iris-stack docs/contracts/go-json-v2.md)
        - pattern: ^jsontext\.(AllowDuplicateNames|AllowInvalidUTF8)$
          pkg: ^encoding/json/jsontext$
          msg: v1 동작을 복원하는 option 대신 producer·consumer의 type/tag와 fixture를 함께 고친다 (iris-stack docs/contracts/go-json-v2.md)
        - pattern: ^sort\.(Strings|Ints|Float64s|Slice|SliceStable)$
          pkg: ^sort$
          msg: slices.Sort, slices.SortFunc, slices.SortStableFunc를 쓴다 (iris-stack docs/contracts/go-modernization.md)
        - pattern: ^atomic\.(Add|Load|Store|Swap|CompareAndSwap)(Int32|Int64|Uint32|Uint64|Uintptr|Pointer)$
          pkg: ^sync/atomic$
          msg: atomic.Int64, atomic.Pointer[T] 같은 typed atomic 값을 쓴다 (iris-stack docs/contracts/go-modernization.md)
        - pattern: ^errors\.As$
          pkg: ^errors$
          msg: target 타입이 정적으로 정해지면 errors.AsType[T]를 쓴다. target을 any로 받는 helper만 line-scoped nolint 사유를 남긴다 (iris-stack docs/contracts/go-modernization.md)
        - pattern: ^pgxpool\.(Pool|Conn)\.(Exec|Query|QueryRow)$
          pkg: ^github\.com/jackc/pgx/v5/pgxpool$
          msg: pgxdb.Exec·Query·QueryRow에 pgxdb.Statement를 넘긴다. SQL은 queries/*.sql에 두고 pgxdb.MustStatement로 읽는다
        - pattern: ^pgx\.(Conn|Tx)\.(Exec|Query|QueryRow)$
          pkg: ^github\.com/jackc/pgx/v5$
          msg: pgxdb.Exec·Query·QueryRow에 pgxdb.Statement를 넘긴다. SQL은 queries/*.sql에 두고 pgxdb.MustStatement로 읽는다
        - pattern: ^pgx\.Batch\.Queue$
          pkg: ^github\.com/jackc/pgx/v5$
          msg: pgxdb.Queue에 pgxdb.Statement를 넘긴다. SQL은 queries/*.sql에 두고 pgxdb.MustStatement로 읽는다
        - pattern: ^pgxdb\.Querier\.(Exec|Query|QueryRow)$
          pkg: ^github\.com/park285/shared-go/postgres/pgxdb$
          msg: pgxdb.Exec·Query·QueryRow에 pgxdb.Statement를 넘긴다. SQL은 queries/*.sql에 두고 pgxdb.MustStatement로 읽는다
        - pattern: ^pgx\.(BeginFunc|BeginTxFunc)$
          pkg: ^github\.com/jackc/pgx/v5$
          msg: Begin·BeginTx 뒤에 defer pgxdb.RollbackDeferred(ctx, tx, &err)를 두고 tx.Commit(ctx)로 끝낸다. BeginFunc는 취소된 ctx로 롤백해 연결을 잃는다
        - pattern: ^pgx\.Tx\.Rollback$
          pkg: ^github\.com/jackc/pgx/v5$
          msg: 롤백은 취소와 분리된 컨텍스트로 보내는 pgxdb.Rollback 또는 defer pgxdb.RollbackDeferred로 한다
        - pattern: ^pgxpool\.(Tx\.Rollback|New|NewWithConfig)$
          pkg: ^github\.com/jackc/pgx/v5/pgxpool$
          msg: 풀은 pgxdb.OpenPool·OpenPoolDSN으로 열고, 롤백은 pgxdb.Rollback 또는 defer pgxdb.RollbackDeferred로 한다

    godox:
      keywords:
        - TODO
        - FIXME
        - HACK
        - XXX

    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*net/http.Response).Body.Close
        - (*os.File).Close
        - (io.Closer).Close
        - errors.AsType

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022

    gocyclo:
      min-complexity: 17

    gocognit:
      min-complexity: 31

    dupl:
      threshold: 200

    goconst:
      min-len: 3
      min-occurrences: 5

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - exitAfterDefer
        - paramTypeCombine
        - unnamedResult
        - filepathJoin
        - hugeParam
        - emptyStringTest

    funlen:
      lines: 180
      statements: 90
      ignore-comments: true

    revive:
      severity: error
      enable-default-rules: true
      directives:
        - name: specify-disable-reason
          severity: error
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: use-any
        - name: use-errors-new
        - name: use-fmt-print
        - name: time-date
        - name: time-equal
        - name: error-naming
        - name: error-return
        - name: unexported-naming
        - name: unnecessary-format
        - name: unnecessary-if
        - name: unsecure-url-scheme
        - name: use-waitgroup-go
        - name: file-length-limit
          arguments:
            - max: 800
          exclude:
            - '~^$'

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    wsl_v5:
      default: all
      allow-first-in-block: false
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0

    godot:
      scope: declarations
      capital: true
      period: true

    copyloopvar:
      check-alias: true

    fatcontext:
      check-struct-pointers: true

    embeddedstructfieldcheck:
      empty-line: true
      forbid-mutex: true

    nilnil:
      only-two: false
      detect-opposite: true

    nlreturn:
      block-size: 2

    predeclared:
      qualified-name: true

    wrapcheck:
      report-internal-errors: false
      ignore-sigs:
        - .Errorf(
        - .LogAndWrapError(
        - .NewWebhookAdmissionError(
        - .NewAmbiguousMatchError(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(
        - .Error()
        - .Err()
        - .Marshal(
        - .Unmarshal(
        - .Encode(
        - .MarshalIndent(
        - .Submit(
        - .Shutdown(
        - .DialContext(
        - .ReadAll(
        - .Read(
        - .AsInt64(
        - .NewPool(
      ignore-package-globs:
        - context
        - crypto/rand
        - encoding/*
        - io
        - net/http
        - github.com/quic-go/quic-go/*
        - net/netip
        - github.com/jackc/pgx/v5
        - github.com/jackc/pgx/v5/*
        - github.com/park285/shared-go/postgres/pgxdb
        - github.com/go-playground/validator/v10
        - github.com/panjf2000/ants/*
        - github.com/stretchr/testify/*
        - github.com/valkey-io/valkey-go
        - github.com/valkey-io/valkey-go/*
        - google.golang.org/grpc
        - google.golang.org/grpc/*
        - golang.org/x/sync/*
        - github.com/kapu/hololive-collector/internal/runtime/collecterr
        - github.com/park285/iris-client-go/v5/internal/*
        - github.com/park285/iris-console/internal/apierr
        - github.com/park285/iris-console/internal/value

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-date-month: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true

    interfacebloat:
      max: 5

    maintidx:
      under: 35

    nestif:
      min-complexity: 4

    testifylint:
      enable-all: true

    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true

  exclusions:
    generated: strict
    warn-unused: true
    rules:
      - path: (_test\.go$|(^|/)(testsupport|[^/]*dbtest|e2e|mocks|testdata|fixtures)/)
        linters:
          - forbidigo
        text: pgxdb\.

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false

formatters:
  enable:
    - gci
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/park285/shared-go/v2)
      custom-order: true
      no-inline-comments: true
      no-prefix-comments: true

    gofumpt:
      extra:
        group-params: true

    goimports:
      local-prefixes:
        - github.com/park285/shared-go/v2

  exclusions:
    generated: strict
    warn-unused: true
