# 이 파일은 tools/lint/golangci.template.yml에서 생성된다. 직접 고치지 말고 템플릿을 고친 뒤
# bash tools/lint/render-golangci.sh 를 실행한다. 저장소별 차이는 tools/lint/golangci-repos.tsv의 module path·import prefix뿐이다.
version: "2"

run:
  timeout: 10m
  tests: true
  modules-download-mode: readonly
  relative-path-mode: gomod

linters:
  default: none
  enable:
    # correctness
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # resources / context / concurrency
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - containedctx
    - contextcheck
    - noctx
    - fatcontext
    - copyloopvar

    # modern Go / stdlib / simplification
    - durationcheck
    - embeddedstructfieldcheck
    - exptostd
    - intrange
    - makezero
    - mirror
    - modernize
    - recvcheck
    - unconvert
    - unqueryvet
    - usestdlibvars

    # errors
    - errchkjson
    - errname
    - errorlint
    - nilerr
    - nilnesserr
    - nilnil
    - wrapcheck

    # style / docs / suppression hygiene
    - godot
    - misspell
    - nakedret
    - nlreturn
    - nolintlint
    - predeclared
    - revive
    - sloglint
    - whitespace
    - wsl_v5
    - wastedassign

    # maintainability
    - dupl
    - exhaustive
    - funlen
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - interfacebloat
    - maintidx
    - nestif
    - prealloc
    - unparam

    # tests
    - testifylint
    - thelper
    - tparallel
    - usetesting

    # security / text safety
    - bidichk
    - gosec

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*database/sql.Rows).Close
        - (*database/sql.DB).Close
        - (*net/http.Response).Body.Close
        - (*os.File).Close
        - (io.Closer).Close
        - errors.AsType

    govet:
      enable-all: true
      disable:
        - fieldalignment

    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022

    gocyclo:
      min-complexity: 17

    gocognit:
      min-complexity: 31

    dupl:
      threshold: 200

    goconst:
      min-len: 3
      min-occurrences: 5

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    prealloc:
      simple: true
      range-loops: true
      for-loops: false

    gocritic:
      enabled-tags:
        - diagnostic
        - experimental
        - opinionated
        - performance
        - style
      disabled-checks:
        - dupImport
        - ifElseChain
        - octalLiteral
        - whyNoLint
        - exitAfterDefer
        - paramTypeCombine
        - unnamedResult
        - filepathJoin
        - hugeParam
        - emptyStringTest

    funlen:
      lines: 180
      statements: 90
      ignore-comments: true

    revive:
      severity: error
      enable-default-rules: true
      directives:
        - name: specify-disable-reason
          severity: error
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
        - name: use-any
        - name: use-errors-new
        - name: use-fmt-print
        - name: time-date
        - name: time-equal
        - name: error-naming
        - name: error-return
        - name: unexported-naming
        - name: unnecessary-format
        - name: unnecessary-if
        - name: unsecure-url-scheme
        - name: use-waitgroup-go

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    wsl_v5:
      default: all
      allow-first-in-block: false
      allow-whole-block: false
      branch-max-lines: 2
      case-max-lines: 0

    godot:
      scope: declarations
      capital: true
      period: true

    copyloopvar:
      check-alias: true

    fatcontext:
      check-struct-pointers: true

    embeddedstructfieldcheck:
      empty-line: true
      forbid-mutex: true

    nilnil:
      only-two: false
      detect-opposite: true

    nlreturn:
      block-size: 2

    predeclared:
      qualified-name: true

    wrapcheck:
      # 같은 패키지 helper의 오류는 그 helper가 이미 맥락을 붙였으므로 다시 감싸지 않는다(2026-09-02 재감사 T03: 지점 억제 337건의 원인).
      report-internal-errors: false
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Join(
        - errors.Unwrap(
        - .Error()
        - .Err()
        - .Marshal(
        - .Unmarshal(
        - .Encode(
        - .MarshalIndent(
        - .Submit(
        - .Shutdown(
        - .DialContext(
        - .ReadAll(
        # io.Reader 계약은 io.EOF를 포함한 하위 reader 오류를 그대로 전달한다.
        - .Read(
        - .AsInt64(
        - .NewPool(
      ignore-package-globs:
        # 표준 라이브러리 leaf 오류(취소·EOF·파싱·검증 sentinel)는 호출자가 그대로 보존한다.
        - context
        - crypto/rand
        - encoding/*
        - io
        - net/http
        # H3 RoundTripper 어댑터는 net/http와 같은 전송 leaf 계약으로 하위 오류를 그대로 전달한다.
        - github.com/quic-go/quic-go/*
        - net/netip
        # PostgreSQL adapter는 SQL 연산 맥락을 소유하고, 호출자는 repository/service 경계에서 pgx 오류 판별을 유지한 채 감싼다.
        - github.com/jackc/pgx/v5
        - github.com/jackc/pgx/v5/*
        - github.com/go-playground/validator/v10
        - github.com/panjf2000/ants/*
        - github.com/stretchr/testify/*
        - github.com/valkey-io/valkey-go
        - github.com/valkey-io/valkey-go/*
        - google.golang.org/grpc
        - google.golang.org/grpc/*
        # 콜백 오류를 그대로 돌려주는 combinator다.
        - golang.org/x/sync/*
        # 타입이 있는 오류 생성자 패키지와 SDK 내부 구현은 호출자가 그 오류를 그대로 공개 표면으로 낸다.
        - github.com/kapu/hololive-youtube-collector/internal/runtime/collecterr
        - github.com/park285/iris-client-go/v2/internal/*

    usestdlibvars:
      http-method: true
      http-status-code: true
      time-date-month: true
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      tls-signature-scheme: true
      constant-kind: true

    interfacebloat:
      max: 5

    maintidx:
      under: 35

    nestif:
      min-complexity: 4

    testifylint:
      enable-all: true

    usetesting:
      os-temp-dir: true
      context-background: true
      context-todo: true

  exclusions:
    generated: strict
    warn-unused: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  new: false

formatters:
  enable:
    - gci
    - gofumpt
    - goimports

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/park285/shared-go/v2)
      custom-order: true
      no-inline-comments: true
      no-prefix-comments: true

    gofumpt:
      module-path: github.com/park285/shared-go/v2
      extra:
        group-params: true

    goimports:
      local-prefixes:
        - github.com/park285/shared-go/v2

  exclusions:
    generated: strict
    warn-unused: true
