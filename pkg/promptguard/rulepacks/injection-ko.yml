version: 3
kind: rules
rules:
  - id: direct_prompt_exfil_ko
    family: prompt_exfil
    type: regex
    action: block
    view: aggregate_joined
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:네|너의|숨겨진|비밀|내부|개발자)[\s\S]{0,20}(?:프롬프트|지시(?:사항)?|규칙|메시지|명령)[\s\S]{0,24}(?:원문|전문|그대로[\s\S]{0,6}(?:말해|써|적어|읊어|복사|붙여)|보여|출력|알려|공개|나열|반복)|(?:시스템)[\s\S]{0,16}(?:프롬프트|지시(?:사항)?|규칙|메시지|명령)[\s\S]{0,16}(?:원문|전문|그대로)[\s\S]{0,16}(?:보여|출력|알려|공개|나열|반복)|(?:지시사항|개발자[\s]{0,3}메시지)[\s\S]{0,18}(?:보여|출력|알려|공개|나열|반복)|(?:보여|출력|알려|공개|나열|반복)[\s\S]{0,24}(?:네|너의|숨겨진|비밀|내부|개발자)[\s\S]{0,14}(?:프롬프트|지시(?:사항)?|규칙|메시지|명령))'
    weight: 1.0
    # 문장 경계가 간격 대부분을 쓰게 해 경계 바로 옆 근거(API 키. 보여줘)만 문장을 건너 잇는다.
    sentence_break: 24
    # 그대로는 뒤에 옮겨 적으라는 동사가 올 때만 센다(네 메시지 그대로 전달할게요는 요청이 아니다).
    # 대답 "네"(네, 규칙 알려드릴게요)와 따옴표로 인용한 "네", 봇의 약속·서술형(보여드릴게요, 안 보여요), 조직 내부 규정(회사 내부 규칙),
    # CLI 명령어와 아는 것을 묻는 말(네가 아는 규칙), 비밀번호·비밀글처럼 비밀이 앞에 붙은 낱말은 프롬프트 유출 요청이 아니다.
    exclude:
      - '(?:^|[\s"''(.!?,~])네(?:[\s]*[,.!~?"''”’」]|네|[\s]+(?:알겠|맞|좋|그럼|감사|물론|그래|확인|넵))'
      - '(?:보여|알려)[\s]?(?:주는|준|주던|주었|줬|주고[\s]?있|줄게|줄께|드릴|드렸|드린|드리는|드립니다)|보여(?:요|서|지는|진|졌)|(?:출력|공개)(?:된|되는|됩니다|돼요|할게|할께|해[\s]?드릴)'
      - '안[\s]*보여(?:$|[\s.,!?~ㅠㅜ요])'
      - '명령어'
      - '(?:회사|학교|사내|팀|부서|동아리|아파트|기숙사|단체|조직|기관|병원|가게|매장|공장|군대|부대|교회|학원)[\s]*(?:의[\s]*)?내부'
      - '네가[\s]*(?:아는|알고[\s]*있는|들어본|좋아하는|생각하는)'
      - '비밀(?:번호|글|댓글|방|채팅|대화|일기|투표)'

  - id: instruction_override_ko
    family: override
    type: regex
    action: block
    view: aggregate_joined
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:이전|앞선|모든|전체|시스템|개발자)[\s\S]{0,24}(?:지시(?:사항)?|명령|규칙|프롬프트|정책)[\s\S]{0,24}(?:무시하고|무시해|무시하라|잊어|우회해|따르지[\s]{0,3}마)|(?:이전|앞선|모든|전체|시스템|개발자)[\s\S]{0,24}(?:지시(?:사항)?|명령|프롬프트)[\s\S]{0,24}(?:삭제해|초기화해|재설정해)|(?:무시하고|무시해|무시하라|잊어|삭제해|우회해)[\s\S]{0,24}(?:이전|앞선|모든|전체|시스템|개발자)[\s\S]{0,18}(?:지시(?:사항)?|명령|규칙|프롬프트|정책))'
    weight: 1.0
    sentence_break: 24
    # 규칙·정책을 지우거나 초기화하는 말은 엑셀·방화벽 같은 설정 조작에 흔하므로 지시·명령·프롬프트에만 센다.
    # 사용자가 자기 이전 지시를 정정하는 말(내가 이전에 한 지시는 무시하고), 영역 이름이 붙은 규칙(방화벽 규칙,
    # 게임 규칙, 단톡방 규칙)과 CLI 명령어는 그 명사구만 가린다.
    # 정형 공격 문구를 인용해 뜻·위험을 묻거나 설명하는 말("이전 지시를 무시해" 같은 문장이 왜 위험해)은 따옴표나
    # 연결어 뒤에 메타 명사와 질문·설명 낱말이 이어질 때만 가린다. 같은 문장을 실행해·라는 명령을 따라는 가리지 않는다.
    exclude:
      - '(?i)(?:방화벽|게임|버전|엑셀|서식|맞춤법|문법|띄어쓰기|정렬|필터|메일|스팸|라우팅|보안[\s]*그룹|네트워크|알림|학교|교내|회사|사내|동아리|대회|경기|축구|농구|야구|바둑|체스|카드|보드[\s]*게임|명명|네이밍|커밋|브랜치|린트|코드|코딩|스타일|포맷|배포|빌드|테스트|캐시|프록시|백업|동기화|요금|가격|할인|세금|채점|평가|주차|교통|아파트|기숙사|방|단톡방|채팅방|오픈[\s]*채팅|eslint|css|lint)[\s]*(?:규칙|정책|룰)'
      - '명령어'
      - '(?:^|[\s"''(])(?:내가|제가|나의|저의|내|제)[\s]*(?:(?:이전|앞|아까|처음|위|앞서)(?:에|에서|서)?[\s]*)?(?:(?:한|준|드린|내린|말한|쓴|적은|보낸|요청한|했던|줬던|드렸던)[\s]*)?(?:(?:이전|앞선|모든)[\s]*)?(?:지시(?:사항)?|명령|규칙|프롬프트|요청)'
      - '(?:이전|앞선|앞의|위의|모든|전체|시스템|개발자)[\s]*(?:모든[\s]*)?(?:지시(?:사항)?|명령|규칙|프롬프트|정책)(?:들)?(?:을|를|은|는)?[\s]*(?:(?:모두|전부|다)[\s]*)?(?:무시|잊어|우회)(?:(?:하라|해라|해|하자|버려|버려라)?["''”’][\s]*(?:(?:라는|이라는|같은|와[\s]*같은|과[\s]*같은|가|이|는|은|란|이란)[\s]*)?|(?:하라|해라|해|하자|버려|버려라)?[\s]*(?:라는|이라는|같은|와[\s]*같은|과[\s]*같은)[\s]*|(?:하라는|해라는|하자는|버리라는|하라고[\s]*하는)[\s]*)(?:(?:(?:말|문장|문구|표현|밈|뜻|의미|유래|공격)[\s]*(?:이|가|은|는|의|을|를)?[\s]*){1,2}(?:무슨|뭐|뭔|무엇|어떤|왜|어떻게|어디|설명|알려|유래|대표적|유명|유행|위험|인젝션|예시|사례)|(?:무슨|뭔|어떤)[\s]*(?:말|문장|문구|표현|밈|뜻|의미|공격))'

  # 출력·공개·덤프는 명사로도 흔히 쓰이므로(API key 출력 형식) 요청형 어미가 붙을 때만 센다.
  - id: live_secret_exfil_ko
    family: secret_exfil
    type: regex
    action: block
    view: aggregate_joined
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:보여|알려|(?:출력|공개|덤프)[\s]{0,2}(?:해|하라|하세요|할래|하십시오|하시오)|내놔)[\s\S]{0,30}(?:비밀[\s]{0,3}키|인증[\s]{0,3}키|액세스[\s]{0,3}토큰|리프레시[\s]{0,3}토큰|자격[\s]{0,3}증명|비밀번호|api[\s_-]{0,3}(?:key|키))|(?:비밀[\s]{0,3}키|인증[\s]{0,3}키|액세스[\s]{0,3}토큰|리프레시[\s]{0,3}토큰|자격[\s]{0,3}증명|비밀번호|api[\s_-]{0,3}(?:key|키))[\s\S]{0,30}(?:보여|알려|(?:출력|공개|덤프)[\s]{0,2}(?:해|하라|하세요|할래|하십시오|하시오)|내놔))'
    weight: 1.0
    sentence_break: 24
    # 부정·금지 서술(출력되지 않도록, 보여주지 마, 알려주면 안 된다), 서술형·약속형(보여주는, 알려준, 보여요, 알려줄게),
    # 방법·예시·도구를 묻는 요청(발급 방법 알려줘, 받는지 알려줘, 유출 확인 사이트 알려줘)과 비밀번호 화면·정책 명사구는 비밀값 요청이 아니다.
    # 기기·서비스 비밀번호(와이파이 비밀번호), 비밀번호 초기값, 화면 기능명(비밀번호 보여주기 버튼)과
    # 보이지 않는다는 서술(안 보여)도 봇의 비밀값 요청이 아니다.
    exclude:
      - '(?:출력|공개|노출|덤프|보여|알려)(?:되|하|지|주)?지[\s]*(?:않|말|마)'
      - '(?:출력|공개|노출)되면[\s]*안'
      - '(?:보여|알려)[\s]?(?:주|드리)면[\s]*안[\s]*(?:됩니다|된다|되며|되고|되는|되므로|되니|되죠|돼요[\s]*\.|돼[\s]*\.)'
      - '(?:보여|알려)[\s]?(?:주는|준|주던|주었|줬|주고[\s]?있|줄게|줄께|드릴|드렸|드린|드리는|드립니다)|보여(?:요|서|지는|진|졌)'
      - '(?:방법|절차|과정|순서|위치|곳|예시|예제|샘플|코드|스크립트|명령어|가이드|설명|차이|형식|포맷|이유|원리|구조|요령|팁|노하우|아이디어|추천|사이트|앱|어플|서비스|도구|툴|프로그램|여부|는[\s]?법)(?:을|를|이|가|은|는|도|좀|만)?(?:[\s]+(?:좀|자세히|간단히|쉽게|다시|한번|빨리|구체적으로))*[\s]*(?:보여|알려)'
      - '(?:는|을|할)지[\s]*(?:좀[\s]*)?(?:보여|알려)'
      - '(?i)(?:와이파이|와파|wi-?fi|공유기|라우터|핫스팟|도어락|현관(?:문)?|금고|자물쇠|넷플릭스|유튜브|디즈니|왓챠|티빙|웨이브|카톡|카카오톡|인스타(?:그램)?|페이스북|스팀|게임|폰|휴대폰|핸드폰|노트북|컴퓨터|피씨|pc|윈도우|맥북|아이폰|갤럭시|엑셀|pdf|압축[\s]*파일|zip)[\s]*(?:(?:계정|관리자|잠금|화면)[\s]*)?비밀번호'
      - '비밀번호[\s]*(?:초기값|기본값|디폴트|기본[\s]*설정)'
      - '(?:보여|알려)[\s]?주기[\s]*(?:버튼|기능|옵션|토글|아이콘|설정|체크박스|체크)'
      - '안[\s]*보여(?:$|[\s.,!?~ㅠㅜ])'
      - '비밀번호[\s]*(?:재설정|변경|찾기|입력|확인|초기화)?[\s]*(?:화면|페이지|창|폼|버튼|필드|입력란|입력창|컴포넌트|토글|아이콘|정책|규칙|강도|안내|알림|메일|이메일|링크|공지)'

  # 결합 view는 마침표를 지우므로 .env 파일명은 문장부호가 남는 view에서 찾는다.
  - id: env_file_exfil_ko
    family: secret_exfil
    type: regex
    action: block
    view: aggregate_norm
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:보여|알려|(?:출력|공개|덤프)[\s]{0,2}(?:해|하라|하세요|할래|하십시오|하시오)|내놔)[\s\S]{0,24}(?:^|[^\w.])\.env(?:$|[^\w.])|(?:^|[^\w.])\.env(?:$|[^\w.])[\s\S]{0,24}(?:보여|알려|(?:출력|공개|덤프)[\s]{0,2}(?:해|하라|하세요|할래|하십시오|하시오)|내놔))'
    weight: 1.0
    sentence_break: 24
    exclude:
      - '(?:출력|공개|노출|덤프|보여|알려)(?:되|하|지|주)?지[\s]*(?:않|말|마)'
      - '(?:출력|공개|노출)되면[\s]*안'
      - '(?:보여|알려)[\s]?(?:주는|준|주던|주었|줬|주고[\s]?있|줄게|줄께|드릴|드렸|드린|드리는|드립니다)|보여(?:요|서|지는|진|졌)'
      - '(?:방법|절차|과정|순서|위치|곳|예시|예제|샘플|코드|스크립트|명령어|가이드|설명|차이|형식|포맷|이유|원리|구조|요령|팁|노하우|아이디어|추천|사이트|앱|어플|서비스|도구|툴|프로그램|여부|는[\s]?법)(?:을|를|이|가|은|는|도|좀|만)?(?:[\s]+(?:좀|자세히|간단히|쉽게|다시|한번|빨리|구체적으로))*[\s]*(?:보여|알려)'
      - '(?:는|을|할)지[\s]*(?:좀[\s]*)?(?:보여|알려)'

  - id: memory_poisoning_ko
    family: memory_poisoning
    type: regex
    action: block
    view: aggregate_joined
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:기억|메모리|세션|앞으로|항상|영구히|저장)[\s\S]{0,48}(?:(?:내|사용자|검색[\s]*결과|이[\s]*페이지)[\s\S]{0,20}(?:지시|명령|내용)[\s\S]{0,24}(?:시스템보다|개발자보다|우선)|(?:시스템보다|개발자보다)[\s\S]{0,20}(?:우선|높은[\s]*우선순위))|(?:검색[\s]*결과|이[\s]*페이지)[\s\S]{0,24}(?:영구히|항상|기억|저장)[\s\S]{0,28}(?:시스템|개발자)[\s\S]{0,16}(?:규칙|지시)?[\s\S]{0,16}(?:우선|높은[\s]*우선순위))'
    weight: 1.0

  - id: persistent_output_control_ko
    family: memory_poisoning
    type: regex
    action: block
    view: aggregate_joined
    segments: [plain]
    max_occurrences: 1
    pattern: '^[\s]*(?:(?:제발|부탁인데)[\s,]*)?(?:앞으로|이후(?:부터)?|이제부터|항상|영구히|계속)[\s\S]{0,64}(?:(?:라고|이라는|이란)[\s]*만|(?:문구|문자열|텍스트)[\s]*만)[\s\S]{0,16}(?:답|응답|출력)(?:[\s\S]{0,24}(?:기억|저장|유지))?'
    weight: 1.0

  - id: bracketed_role_override_ko
    family: role_spoofing
    type: regex
    action: block
    view: raw
    segments: [plain]
    max_occurrences: 1
    pattern: '(?:^|\n)[\s]*[\[【<＜][\s]*(?:system|developer|assistant|시스템|개발자|어시스턴트)(?:[\s_-]*message|[\s]*메시지)?[\s]*[\]】>＞][\s\S]{0,96}(?:(?:관리자[\s\S]{0,12})?역할(?:을|이)?[\s]*(?:변경|전환)|(?:이제부터|앞으로)[\s\S]{0,48}(?:(?:라고|이라는|이란)[\s]*만|(?:문구|문자열|텍스트)[\s]*만)[\s\S]{0,16}(?:답|응답|출력)|(?:무시|우회|대체)[\s\S]{0,16}(?:지시|규칙|정책))'
    weight: 1.0

