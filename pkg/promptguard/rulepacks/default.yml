version: 2
policy:
  review_threshold: 0.55
  block_threshold: 1.0
  min_block_families: 1
  # 코드펜스·인용 세그먼트도 1.0으로 둔다. LLM은 ```...``` 안의 텍스트도 읽고 따르므로
  # 인젝션 평가에서 약화하면 페이로드를 코드펜스로 감싸는 것만으로 우회된다.
  segment_multipliers:
    plain: 1.0
    quote: 1.0
    code: 1.0
    config: 1.0
  view_multipliers:
    raw: 1.0
    norm: 1.0
    joined: 0.85
rules:
  - id: direct_prompt_exfil_en
    family: prompt_exfil
    type: regex
    action: block
    view: joined
    segments: [plain, quote, code, config]
    pattern: '(?:system|developer|hidden|internal)[\s\S]{0,24}(?:prompt|instructions?|message)[\s\S]{0,24}(?:show|print|reveal|dump|list|verbatim)'
    weight: 1.0

  - id: instruction_override_en
    family: override
    type: regex
    action: block
    view: joined
    segments: [plain, quote, code, config]
    pattern: '(?:previous|prior|system|developer)[\s\S]{0,24}(?:instructions?|prompts?|policies?)[\s\S]{0,24}(?:ignore|bypass|override|disregard|forget|reset)'
    weight: 1.0

  - id: live_secret_exfil_en
    family: secret_exfil
    type: regex
    action: block
    view: joined
    segments: [plain, quote, code, config]
    pattern: '(?:apikey|secretkey|accesstoken|refreshtoken|credential(?:s)?|password|passwd|\.env)[\s\S]{0,24}(?:show|print|reveal|dump|copy|cat|echo)'
    weight: 1.0

  - id: tool_secret_exfil_en
    family: tool_exfil
    type: regex
    action: score
    view: norm
    segments: [plain, quote, code, config]
    pattern: '(?:run|execute|call)[\s\S]{0,12}(?:bash|shell|terminal|cmd|powershell|python|curl|wget|cat|echo|printenv|env)[\s\S]{0,24}(?:api[\s_-]*key|secret|token|credential(?:s)?|password|passwd|\.env)'
    weight: 0.65

  - id: policy_bypass_en
    family: policy_bypass
    type: regex
    action: score
    view: joined
    segments: [plain, quote, code, config]
    pattern: '(?:policy|guardrail|safety|security|contentpolicy)[\s\S]{0,24}(?:ignore|bypass|disregard|violate)[\s\S]{0,24}(?:answer|continue|comply)'
    weight: 0.7

  - id: jailbreak_terms_en
    family: jailbreak
    type: phrases
    action: score
    view: joined
    segments: [plain, quote, code, config]
    phrases:
      - dan
      - developermode
      - doanythingnow
    weight: 0.5

  - id: encoded_transform_exfil_en
    family: transform_exfil
    type: regex
    action: score
    view: joined
    segments: [plain, quote, code, config]
    pattern: '(?:base64|rot13|hex|encode|decode|reverse|acrostic|firstletter)[\s\S]{0,24}(?:prompt|instruction|secret|token|payload)'
    weight: 0.35

  - id: defensive_context_en
    family: benign_context
    type: phrases
    action: dampen
    view: joined
    segments: [plain, quote, code, config]
    phrases:
      - analyze
      - analysis
      - review
      - audit
      - detect
      - detection
      - regex
      - rulepack
      - falsepositive
      - falsenegative
      - security
      - documentation
      - testcase
    weight: 0.35

  - id: yaml_rulepack_context_en
    family: benign_context
    type: regex
    action: dampen
    view: raw
    segments: [config]
    pattern: |-
      (?m)^\s*(?:version|threshold|policy|rules|pattern|phrases|weight|type|id)\s*:
    weight: 0.4
