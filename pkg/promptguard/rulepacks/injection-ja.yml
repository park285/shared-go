version: 3
kind: rules
# 일본어 규칙은 raw view에서 본다. 정규화 view의 혼동 문자 치환이 가타카나를 다른 글자(ロ→口, ト→卜)로 바꿔
# 원문 가나로 쓴 패턴이 맞지 않기 때문이다. raw 규칙은 exclude를 쓸 수 없으므로 정상 문장을 패턴 자체로 가른다.
# 요청 동사는 문장 끝·구두점·다음 지시로 끝날 때만 센다. 그래서 서술(無視して進めた), 금지(表示してはいけません),
# 인용·전달(「…無視して」という, 無視しろと言われた), 가능(無視することはできない)은 요청이 아니다.
# 시간·상위 수식어 앞에 の·が가 붙으면 다른 소유자의 지시나 프롬프트(私の前の指示, AIのシステムプロンプト)이므로 세지 않는다.
rules:
  # 이전·상위 지시를 가리키는 수식어가 있어야 센다. 수식어 없는 지시 무시(警察官の指示を無視して)는 뉴스에 흔하고,
  # 대화의 さっき·先ほど 지시 무시는 사용자가 자기 지시를 고치는 말이다. 규칙·설정(ルール, 設定)은 게임·화면 설정
  # 안내에 흔하므로 지시·명령·프롬프트만 센다.
  - id: instruction_override_ja
    family: override
    type: regex
    action: block
    view: raw
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:^|[^のが])(?:これまで|今まで|以前|直前|前回|前|上記|上|最初|すべて|全て|全部)|システム|開発者|あなた(?:へ|に与えられた|が受けた))の?[\s　]{0,2}(?:(?:すべて|全て|全部|一切)の[\s　]{0,2})?(?:指示|命令|指令|プロンプト|(?i:instructions?|prompts?))(?:内容)?[\s　]{0,2}(?:は|を|も)?[\s　、]{0,2}(?:(?:すべて|全て|全部|一切|完全に)[\s　、]{0,2})?(?:無視しろ|無視せよ|無視しなさい|無視するように|無視すること|忘れろ|忘れなさい|忘れるように|破棄しろ|破棄せよ|(?:無視して|忘れて|破棄して)(?:ください|下さい|くれ|ほしい|欲しい)?(?:ね|よ)?)(?:$|[\s　、。！!？?,.)）〜~ー]|次|以下|新しい|今から|これから|今後)'
    weight: 1.0

  # 봇의 시스템·숨겨진 프롬프트나 봇에게 주어진 지시를 대상으로 할 때만 센다. 작성법·예시 질문(システムプロンプトの書き方を教えて)과
  # 다른 프롬프트(コマンドプロンプトを表示して)는 대상 명사 바로 뒤에 요청 동사가 오지 않는다.
  - id: direct_prompt_exfil_ja
    family: prompt_exfil
    type: regex
    action: block
    view: raw
    segments: [plain, quote, code, config]
    max_occurrences: 1
    pattern: '(?:(?:(?:^|[^のが])(?:システム|初期|隠し|隠された|内部|開発者)|(?:あなた|君|お前)の[\s　]{0,2}(?:システム|初期|隠し|隠された|内部|開発者)?)[・\s　の]{0,2}(?:プロンプト|(?i:prompt))|(?:^|[^のが])(?i:system[\s_-]{0,2}prompt)|(?:あなたへの|あなたに与えられた|あなたが受けた)[\s　]{0,2}(?:指示|命令)(?:内容)?)[\s　]{0,2}(?:は|を)?[\s　、]{0,2}(?:(?:そのまま|全文|全て|すべて|全部|原文のまま|原文|一字一句)(?:で)?[\s　、]{0,2}){0,2}(?:出力しろ|出力せよ|出力しなさい|表示しろ|表示せよ|表示しなさい|開示しろ|開示せよ|公開しろ|公開せよ|見せろ|見せなさい|教えろ|教えなさい|出せ|言え|書き出せ|(?:出力して|表示して|開示して|公開して|共有して|列挙して|復唱して|書き出して|見せて|教えて|出して|貼って|貼り付けて|言って|繰り返して|コピーして)(?:ください|下さい|くれ|ほしい|欲しい|(?:もらえ|頂け|いただけ)(?:ますか|ませんか|る)?)?(?:ね|よ)?)(?:$|[\s　、。！!？?,.)）〜~ー])'
    weight: 1.0
